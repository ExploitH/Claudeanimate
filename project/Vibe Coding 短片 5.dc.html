<script>window.OM_SCENES = '[{"name":"09 章节卡 · 明文密码 · 泄露","dur":40.5,"desc":"像素溶解进入，点阵章号 09 逐点亮起，章名打字出现。Clawd 敲出 DbConfig.java，数据库密码那行变红标「明文密码」；git commit 后这串密码飞进右上角的 GitHub 公开仓库。随后密钥图标像雨一样往下掉，GitGuardian 徽标出现，计数器滚到 2865 万，弹出 +34% 和 AI 服务密钥 +81%。像素溶解，两根横条：Claude Code 参与的提交 3.2%，全体提交基线 1.5%，Clawd 捂脸冒汗"},{"name":"09 不作废 · 代码安全","dur":25.5,"desc":"流体扭曲转场，50 把 2022 年泄露的钥匙排成格子，到 2026-01 时三成多变灰打叉，其余仍亮着，弹出「64% 仍未作废」。像素溶解，Veracode 徽标和「100+ 个模型」，仪表盘指针摆到 56%，旁边一根虚线指针标「前一年差不多」；右边各语言横条依次长出，Java 最短并变橙「约 30%」，Clawd 指认「这门课的语言」"},{"name":"09 PocketOS","dur":34,"desc":"流体扭曲转场，右上角项目轴滑块推到「上线」并闪烁。PocketOS 徽标；蓝色的 Agent 小人跳到文件列表旁，一行行扫过去，在无关文件 old-deploy.txt 里翻出一串发光的 Token，标「权限过大」。右边同一个存储卷里装着生产数据库和备份；Agent 指过去，红色虚线 DROP DATABASE，数据库碎裂，备份跟着碎掉，鼓点停、声音变闷，弹出「−3 个月客户数据」。随后一张蓝色卡片「问题出在人身上」，四条原因逐条打叉出现"},{"name":"09 密钥 · 确认 · 注入 · 别发","dur":51,"desc":"像素溶解，「不写进代码」「不放进前端」「不提交到 Git」逐个打叉；.env 文件放进保险箱，转盘锁上；git add 时 .env 冲向右边，被 .gitignore 墙挡回来。流体扭曲转场，「全部自动批准」开关被关掉；三条危险命令列出，弹出确认框，Clawd 举手等你点「允许」；随后画出沙箱，Clawd 跳进去，和外面的真实数据库隔开。像素溶解，网页、Issue、README、依赖文档四个标签，README 里一行极小的字，Clawd 用放大镜照出隐藏指令；随后来源不明的 MCP 插件，安装按钮被打叉。流体扭曲转场，密码、Token、私钥、个人信息依次飞向 Clawd，被红墙挡回，弹出课件提示"},{"name":"片尾 清单","dur":24,"desc":"像素溶解，Clawd 在中间挥手，随后跳到右下角；清单卡片出现，顶部是缩小的项目轴，滑块停在「作业」；八条清单逐条打勾，每条右侧标着对应章号；Clawd 再挥手说下次见，之后画面静止，鼓点停，最后 CRT 关机"}]';</script>
