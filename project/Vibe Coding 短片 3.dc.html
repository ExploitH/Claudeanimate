<script>window.OM_SCENES = '[{"name":"05 章节卡 · 额度 · 重发 · 赛跑","dur":28.5,"desc":"像素溶解进入，点阵章号 05 逐点亮起，章名打字出现。「登录功能」进度条停在一半；本月额度条从绿变红往下掉，金币往外飞，Clawd 盯着冒汗，最后打问号。左边对话一轮轮变长；Clawd 每轮把全部内容打包扛去给模型，包裹越来越大，右下每轮费用柱越来越高。流体扭曲转场，两条跑道：模型 A 单价低绕 9 圈，模型 B 单价高 2 圈完成；总价条逐圈增长，A 最后反超 B"},{"name":"05 算账 · 三档","dur":28.5,"desc":"左边单价标签，右边小票打出完成一个任务的各项花费和总价，单价标签变暗；随后英文和中文句子被切成 token 块。像素溶解，旗舰、主力、轻量三张卡片由像素拼出；Clawd 依次跳到卡片下，能力、速度、价格点亮，适合的任务逐条弹出"},{"name":"05 思考强度 · 预算 · 排行榜","dur":27.7,"desc":"思考强度滑块；「难题」时推到高，Clawd 头顶的思考泡泡变长；「机械性的修改」时拉到低，弹出省时间、省钱。左边订阅制用量柱撞到上限停住；右边按量付费柱越过预算提醒线，铃铛响。流体扭曲转场，排行榜换个测试工具名次就变；公开题目飞进训练数据；之后你的真实任务分给三个模型，各自返回测试结果"},{"name":"05 国内 · 换模型 · 免费版","dur":26.2,"desc":"通义千问、智谱 GLM、Kimi、DeepSeek 四张卡片依次弹出，每张标上编程套餐。对话里卡住，模型从 A 换成 B 再问一遍；青色像素小人跳进来，和 Clawd 击掌。像素溶解，免费版设置里「用我的数据改进模型」开着，代码流向训练；Clawd 指认后关掉；之后两行：课程练习一般没关系，实习和公司代码按公司规定来"},{"name":"06 章节卡 · 怪事 · 外层 · 部件","dur":35.5,"desc":"像素溶解进入，点阵章号 06 逐点亮起，章名打字出现。两个工具窗口装着同一个模型；左边进度条走完打勾，右边走到一半报错、故障闪烁，Clawd 冒汗打问号。Clawd 跳进中间的「模型」圆圈，外面画出一圈 harness，圈内铺满。外圈拉成椭圆，系统提示词、工具、权限、上下文管理、规则文件、hooks、反馈七个部件从四周飞入；随后 hooks 和上下文管理依次高亮并补充说明"},{"name":"06 发动机 · 成绩 · 其他模型","dur":30,"desc":"像素溶解，Clawd 坐进发动机，车身在外面画出；随后分成两条车道两辆车，Clawd 跳进第一辆。Princeton HAL 徽标，Claude Opus 4.5 · CORE-Bench；通用框架那辆开到 42%，Clawd 换到 Claude Code 那辆开到 78%，再推进到 95%。对比柱：Opus 差距大，其他模型差距小，有一个反过来；之后「模型」和「harness」两块并到一起"},{"name":"06 梯子 · RedAccess","dur":33,"desc":"流体扭曲转场，六级梯子逐级亮起附例，Clawd 往上爬；右侧「亲自看的代码量」下降、「需要的检查和隔离」上升；项目轴滑块推到上线，梯子顶端变红。像素溶解，扫描线扫过约 500 个格子代表 38 万个应用，7 个格子变红代表约 5000 个；随后应用设置里「公开」是默认，「私有」没选"},{"name":"06 七项 · 建议 · 打架","dur":29,"desc":"选工具七项清单逐条打勾，静止约 8 秒，鼓点停、音乐变闷。流体扭曲转场，三张卡片：先用 IDEA 里的 Qoder，熟悉 Git 和命令行后试命令行 Agent，应用生成平台只做原型，Clawd 一路跳过去。两个 Clawd 抢同一个 UserService.java，来回拉扯后文件被扯成两半，弹出「冲突」"}]';</script>
