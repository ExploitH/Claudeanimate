<script>window.OM_SCENES = '[{"name":"00 开机","dur":12,"desc":"全黑里一个光标随心跳闪，打出 vibe coding，每个字母落在音乐盒的一个音上；片名和「导演剪辑版」出现，标题碎成像素聚成 Clawd，墨水渗开转入梦境"},{"name":"01 梦 · 什么是 vibe coding","dur":36,"desc":"流体虹彩的梦境：Karpathy 的原句漂浮，背景代码融化；周末小项目像肥皂泡一个个破掉；柯林斯年度词印章砸下；「审过 · 测过 · 能讲清」三拍各一个勾，画面冻结成晶体；地平线变成项目轴，任务卡钉在「作业」，收集规则 1"},{"name":"02 轨道 · AI 在做什么","dur":32,"desc":"深空里 Clawd 戴宇航员头盔，身边一圈光就是上下文窗口，圈外看不见；四种内容飞进光圈；知识截止日冻结；Agent 绕轨道四个节点每拍亮一个，每圈往窗口里丢一块；塞满后变闷、变模糊；三颗星指向后面三章"},{"name":"03 印刷 · 提示词","dur":36,"desc":"riso 双色印刷海报：「帮我写个登录功能」砸下长出问号树；garbage in, garbage out；五色版式拆出提示词五部分，剪刀按拍子剪掉分叉；清楚版提示词分色排版；报错四样、拆小任务；老套路便签贴上又被抖掉，收集规则 2"},{"name":"04 纸 · 上下文","dur":36,"desc":"剪纸定格动画：纸层叠出 Clawd 看到的全部上下文，规则文件垫底；ETH Zurich 的两根纸条一降一升；@ 指定文件；失败纸条把 Clawd 埋住，新开一张纸只带结论；MCP 接文档，收集规则 3"},{"name":"05 霓虹 · 选模型和费用","dur":40,"desc":"合成波霓虹：额度表报警；每轮对话重发、包裹越来越大；副歌响起，两辆霓虹车赛跑，便宜的多绕几圈总价反超；三块霓虹招牌分档；预算、排行榜、国内模型；Clawd 和另一个小人击掌，收集规则 4"},{"name":"06 蓝图 · Harness","dur":44,"desc":"工程蓝图：同一台发动机装进两辆车；爆炸图七个部件带引线飞入；Princeton HAL 的 42%、78%、95%；六级梯子逐级升调；RedAccess 的点阵；选工具七项规格表；课程建议，收集规则 5"},{"name":"07 存档 · 工作流程","dur":36,"desc":"8-bit 游戏：抱着五个文件跑、冒烟找不到；关卡地图六个节点，在「你看计划」停下等盖章；存档点、被 bug 打中后读档；开分支；GAME OVER 后的 CONTINUE 三选一；收集规则 6"},{"name":"08 黑色电影 · 检查结果","dur":36,"desc":"黑白侦探片，只有红橙色保留：戴侦探帽的 Clawd 举牌说全部通过；diff 里红色的 // 被照出；五个嫌疑人列队；戴墨镜的人抢注假包名；三件事和查包；METR 的两道影子，收集规则 7"},{"name":"09 警报 · 安全和权限","dur":48,"desc":"红色故障警报：明文密码飞向 GitHub，钥匙雨和计数器；3.2% 时 Clawd 捂脸；64% 没作废、56% 和 Java 30%；PocketOS 删库前静音一拍，数据库和备份一起碎掉；之后颜色转青：.env 进保险箱、关自动批准、手动确认和沙箱、放大镜照出注入，收集规则 8"},{"name":"10 回声 · 清单","dur":32,"desc":"E 小调终章：每两小节回到一个世界的画风，规则大字落下后缩进清单，共八条"},{"name":"11 片尾","dur":16,"desc":"干净的清单卡片静止，Clawd 挥手道别，音乐盒弹主旋律、停在 E 大三和弦，两下心跳后光标熄灭"}]';</script>
