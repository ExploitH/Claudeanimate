<script>window.OM_SCENES = '[{"name":"序幕 · 周五 21:00","dur":74,"desc":"雨夜，镜头从窗外推进宿舍；便利贴写着周一交作业，手机上室友说用 AI 半小时就能写完；你打开电脑，Clawd 打招呼；片名。"},{"name":"01 · 21:03 先 vibe 一下","dur":28,"desc":"你说今晚先 vibe 一下，能跑就行；Clawd 问你知不知道这个词从哪来，镜头推进屏幕。"},{"name":"01 梦 · 什么是 vibe coding","dur":174,"desc":"Karpathy 的帖子和三句原文；只说不看的循环；vibe coding 这个名字；他自己说适合用完就扔的小项目；柯林斯年度词；Simon Willison 的界线；项目轴；规则 1。"},{"name":"02 · 21:10 你还记得吧？","dur":34,"desc":"你问它还记不记得上周的代码；对方正在输入了很久，台灯闪了一下：「我不记得你。」"},{"name":"02 轨道 · AI 在做什么","dur":214,"desc":"上下文窗口和圈外的黑暗；窗口里的四样东西；token 和容量上限；训练截止；Agent 的循环；context rot 和压缩；能动手脚的三处。"},{"name":"03 · 21:20 帮我写个登录","dur":42,"desc":"你只发了一句「帮我写个登录功能」，代码一下子刷出来：带注册、记住密码、密码明文存。"},{"name":"03 印刷 · 提示词","dur":214,"desc":"一句话长出问号树；GARBAGE IN, GARBAGE OUT；提示词的五部分和例子；为什么；清楚版提示词全文；报错给四样；大活拆小；老咒语；规则 2。"},{"name":"04 · 21:45 怎么又错了","dur":34,"desc":"Clawd 用 gradle 跑测试，报错找不到命令；它不知道这个项目用 Maven 构建，也不知道测试怎么跑。"},{"name":"04 纸 · 上下文","dur":216,"desc":"窗口里的一摞纸，翻遍了也没写 Maven；规则文件垫在底下，写什么；ETH 的实验：手写、写短；规则 3；输入 @ 点名文件；失败堆满了窗口就新开对话；新库超出训练截止，贴文档、接 MCP。"},{"name":"05 · 22:30 额度没了？","dur":24,"desc":"手机弹出「本月额度已用 94%」，登录才写了一半。"},{"name":"05 霓虹 · 选模型和费用","dur":196,"desc":"用量条；每轮把前面全部重发；霓虹赛道上便宜的模型多绕几圈总价反超；三档模型；思考强度；预算提醒；排行榜；国内模型；换个模型；免费版的数据设置；规则 4；第一次副歌。"},{"name":"06 · 23:00 室友一次就成","dur":30,"desc":"室友发来消息：同一个模型，他一次就写完了；Clawd 说你们用的不是同一辆车。"},{"name":"06 蓝图 · Harness","dur":34,"desc":"两辆线框车装着同一台发动机，一辆顺利写完、一辆半路出错；差别在模型外面那一层；HARNESS。"},{"name":"06 蓝图 3D · 整辆车","dur":88,"desc":"3D：蓝图车间里一辆橙色的车，车身变成线框、零件全部飞散；七个部件按讲解一个个装回原位，每装一个镜头推到它跟前（说明书、车轮、刹车、油箱、导航、雨刷、仪表盘）；车身合上，镜头绕车一圈：发动机是模型，整辆车是 harness；一台只有车架的卡丁车开进来，装上同一台发动机。"},{"name":"06 蓝图 3D · 同一台发动机","dur":62,"desc":"3D 直线赛道：同一台 Claude Opus 4.5 发动机装进只有车架的卡丁车（通用框架）和整辆车（Claude Code），开得越远得分越高；卡丁车停在 42%，整车停在 78%；裁判 Clawd 挥旗修正评分，整车往前推到 95%；换一台别的发动机，两辆车停得很近，卡丁车还略靠前；镜头升起：模型和 harness 一起看。"},{"name":"06 蓝图 · 选工具","dur":128,"desc":"六级工具梯子；RedAccess 点阵和默认公开；选工具七项；规则 5；这门课的路线；两个 Agent 抢一个文件。"},{"name":"07 · 23:40 一口气改完","dur":36,"desc":"你让它一口气全改完；它同时改了五个文件，测试挂了一处，谁也说不清是哪一处。"},{"name":"07 存档 · 工作流程","dur":234,"desc":"五个文件里找一处错；关卡地图六关，第三关你审计划、划掉一步、加一条、盖章；计划模式锁住文件；存档菜单里两次提交，改坏了读档；第二天新对话翻提交记录；矿车开分支、翻车，主线没事；测试灯和假通过；同一堵墙撞三次，暂停菜单三选一；教程关和 == 的坑；听老师的；规则 6。"},{"name":"08 · 00:30 全部通过","dur":30,"desc":"Clawd 说登录功能完成、测试全部通过；你往后一靠，犹豫了一下，还是去看 diff。"},{"name":"08 黑色电影 · 检查结果","dur":100,"desc":"报纸头条「测试全部通过」盖上「待查」；diff 证物，放大镜圈出被注释掉的断言，测试因此「全部通过」；证据墙上五个惯犯；官方指南；四张查无此物的伪造证件。"},{"name":"08 案例复现 · 抢注包名","dur":48,"desc":"3D：雨夜的包仓库大街。五个模型指着同一块空地喊出同一个假包名；53 块空地亮起灯；风衣人走来抢注，空地上长出一家亮着红光的店；Clawd 照着名字走进去，红光涌出；SLOPSQUATTING。"},{"name":"08 黑色电影 · 三件事","dur":92,"desc":"三项检查：恢复被注释的那行、看 diff；自己跑出四个测试一个失败；测边界的三个输入；去 Maven Central 搜一下包名；规则 7；METR 的感觉 +20% 和实测 −19%。"},{"name":"09 · 01:30 就这一次","dur":32,"desc":"登录要连数据库；你让 Clawd 把密码直接写进代码，提交，推到 GitHub。"},{"name":"09 一行密码的旅程 · 扫描","dur":48,"desc":"3D：密码顺着光纤飞进 GitHub 城，扫描无人机的光柱找到它；全城升起 2865 万盏钥匙灯，其中 AI 服务的变成紫色。"},{"name":"09 警报 · 数字","dur":76,"desc":"3.2% 对 1.5% 的泄露率，Clawd 捂脸；2022 年泄露的 50 把钥匙走到 2026 年，还有 64% 能用；Veracode 安全检查通过率 56%，Java 只有 30%。"},{"name":"09 短片 · PocketOS","dur":114,"desc":"3D 短片：机房里，Agent 在无关文件里翻出一把权限过大的钥匙，直连生产库并删掉了它；备份在同一个存储卷上一起碎了；回头看四个原因逐个点亮。"},{"name":"09 从今晚起 · 做法","dur":148,"desc":"颜色转青：密码那行从代码里拿掉，放进 .env 保险箱；.gitignore 挡住 .env；Git 历史里的旧密码作废；关掉全部自动批准；危险命令等你确认；沙箱；放大镜照出 README 里的小字；来路不明的插件别装；别发给我；规则 8。"},{"name":"10 · 03:00 能跑，也能讲清","dur":34,"desc":"凌晨三点，你自己看过 diff、跑过测试，也讲得清每一步在干什么；Clawd 说这回是真的做完了。"},{"name":"10 回声 · 清单","dur":70,"desc":"副歌八小节，每小节翻进一章的画风，Clawd 跟着换装，旁边是那一章的标志物；然后八条规则落进一张清单，每条用它那一章的画风，最后清单转正停住。"},{"name":"11 · 周一 08:00 交了","dur":32,"desc":"周一早上，天亮了，雨停了；便利贴被划掉，作业交了；Clawd 让你把清单截图存好，道别，你合上屏幕，镜头退回窗外。"},{"name":"片尾","dur":22,"desc":"清单逐条打勾；来源；信息截至 2026 年 10 月；音乐盒弹一遍主旋律，两下心跳，光标闪两下，熄灭。"}]';</script>
