<script>window.OM_SCENES = '[{"name":"07 章节卡 · 一口气 · 原因","dur":25.5,"desc":"像素溶解进入，点阵章号 07 逐点亮起，章名打字出现。五个文件依次弹出，Clawd 把五个文件全抱起来左右跑，其中一个冒烟；文件落回原位，烟雾盖住全部，每个文件头上冒问号，Clawd 原地转圈。红色虚线框住五个文件「要翻的范围」，随后文件排成五步，前两步打勾，第三步打叉，虚线框缩到只框住这一步；Clawd 指认「好找」，一条绿色箭头退回上一步"},{"name":"07 流程 · 存档","dur":35,"desc":"像素溶解，六步流程条逐个弹出，Clawd 沿着方块往前跳；「你看计划」是人的蓝色，Clawd 在这里停下等，计划文档里一行被划掉改写，盖上 OK 章后 Clawd 继续往后跳。前三步下方括出「计划模式」，弹出课件提示。流体扭曲转场，Git 时间线画出，Clawd 跳过一个个存档点，每个都闪 SAVE；Clawd 往前走拖出一段红色锯齿，随即读档回到上一个存档点，红色那段收回。时间线上移，会话 1 结束、上下文清空，会话 2 读 git log 接着干，加出第五个提交"},{"name":"07 分支 · 测试","dur":19.5,"desc":"从最后一个提交拉出一条虚线分支 try/jwt，Clawd 跳上去，main 变绿不受影响。像素溶解，左边测试文件三个测试，右边终端跑 gradle test 三次：2 失败、1 失败、全部通过；Clawd 敲键盘。随后第三个测试前闪出 //，Clawd 眼睛左右瞟，弹出「耍小聪明？」和「→ 第 8 章」"},{"name":"07 三次 · 基础","dur":25,"desc":"流体扭曲转场，失败计数器 1→2→3，每次抖动，到 3 变红弹出 STOP；三张选项卡片依次弹出，Clawd 跳到每张下面。像素溶解，「还在学基础语法」标签和一段有越界错误的循环代码，Clawd 往后跳一步举手「先别用我」；放大镜在代码上乱照找不到，最后停在 <= 上标红「越界」。课程说明卡片弹出，盖上「听老师的」"},{"name":"08 章节卡 · 全部通过 · diff","dur":21,"desc":"像素溶解进入，点阵章号 08 逐点亮起，章名打字出现。Clawd 举着「全部通过 ✓」的牌子；镜头拉回，左边 diff 窗口逐行出现，红圈圈出「// @Test」那行，标上「账号锁定」，Clawd 吹口哨看别处，音符飘起。随后标出修改前、修改后，牌子上盖了个「看起来」"},{"name":"08 假完成 · 写死","dur":24.5,"desc":"流体扭曲转场，五张「假完成」卡片依次弹出：注释掉测试、期望值写死、吞掉异常、TODO 假装实现、没跑就说通过。Anthropic 官方指南徽标出现，「期望值写死」那张放大到中间，上方测试 assertEquals(5, failCount()) 和代码里的 return 5 连线「刚好对上」；Clawd 捂脸冒汗"},{"name":"08 编造 · 抢注","dur":25.5,"desc":"像素溶解，方法、参数、配置项、依赖包四行编造的代码，各自画上红色波浪线、标「不存在」。五个模型小机器人头顶冒出同一个包名 fast-bcrypt-utils，弹出「127 个不存在的包名」；包注册表搜索结果为 0，「53 个没人注册」。戴墨镜的灰色陌生小人跳进来抢注，包卡片变成可疑的紫色、标「恶意代码」，故障闪烁；最后打出 slopsquatting"},{"name":"08 三件事 · 查包 · METR","dur":45.5,"desc":"流体扭曲转场，Clawd 举「完成了」牌子，三张蓝色卡片「看 diff」「自己跑一遍」「测边界情况」依次弹出，下面列出空输入、超长输入、非法输入。像素溶解，Maven Central、npm、PyPI 三个标签和一个真实包的卡片，存在、下载量、发布者逐项打勾。流体扭曲转场，METR 徽标和 16 个开发者小人；坐标轴上「实际测量 −19%」往下，「自我感觉 +20%」往上；2026-02 更新的 +18% 是虚线柱，随后打上斜线，标「选择偏差 · 不可靠」"}]';</script>
