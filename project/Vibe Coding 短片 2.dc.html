<script>window.OM_SCENES = '[{"name":"03 章节卡 · 一句话 · 随手挑","dur":28,"desc":"像素溶解进入，点阵章号 03 逐点亮起，章名打字出现。输入框里打出「帮我写个登录功能」并发送，缩成树根；四个没说清的问题依次长出分叉，每个标问号。Clawd 闭眼随手一指，橙色路径一路走到结果，结果不是你想要的，Clawd 捂脸；garbage in / garbage out 打字出现并故障闪烁"},{"name":"03 五部分 · 为什么","dur":31,"desc":"流体扭曲转场，五个彩色标签依次弹出，随旁白逐条打出说明，当前那条高亮。第六条虚线标签「+ 为什么」加入，弹出 Anthropic 官方指南徽标，Clawd 点头"},{"name":"03 清楚版 · 报错","dur":23,"desc":"像素溶解，清楚版提示词按五部分着色打出；下方决策树缩小，Clawd 拿剪刀沿正确路径跳，把分叉一根根剪掉，只剩一条绿色路径。报错单四个栏目依次出现并填入示例，最后一张截图飞进来"},{"name":"03 拆小 · 老套路","dur":27,"desc":"「登录功能」大块裂成三个小任务，各自装进一个对话窗口；Clawd 打问号，弹出「先让我提问」「先让我出个方案」。流体扭曲转场，三张便签贴到 Clawd 身上，Clawd 抖一抖全部抖掉；对话框里的话变成大喊，Clawd 用力过猛跳起，最后恢复正常语气"},{"name":"04 章节卡 · 情况","dur":12,"desc":"像素溶解进入，点阵章号 04 逐点亮起，章名打字出现。左边是写清楚的提示词卡片；Clawd 在终端里敲 gradle build 和 npm test，两次都报错，Clawd 冒汗打问号"},{"name":"04 分层","dur":23,"desc":"第 2 章的容器再次出现，提示词卡片缩成顶上一小块；对话、文件、输出依次填进来，规则文件从底部升起垫在最底层；三个规则文件名飞进底层，旧内容全部清走、只剩规则文件；右侧打开 AGENTS.md 逐行写出"},{"name":"04 研究 · 手写 · 指定文件","dur":31,"desc":"流体扭曲转场，ETH Zurich · ICLR 2026 徽标；「AI 自动生成」柱往下掉，8 个方块里 5 个翻红，标成本 +20% 以上；「开发者手写」柱往上长，Clawd 跳起。自动生成的 8 行 AGENTS.md，从代码里看得出来的 5 行被划掉收起，剩 3 行，标签变成「手写 · 3 行」。整个仓库的文件格子被一个个翻找、染色；输入框打出 @UserService.java，其余变暗，只亮一个文件"},{"name":"04 新对话 · 文档","dur":25.5,"desc":"像素溶解，对话 1 里红色失败块一块块砸下来把 Clawd 埋住，只露出眼睛，声音变闷；对话 2 画出，Clawd 拿着「结论」卡片跳出去。流体扭曲转场，雾里的新版本库卡片；官方文档飞进来，相关段落打进雾里，雾散开；切到 MCP 接口图，Clawd 接上 MCP，再连到文档、工具、数据，数据点来回流动"}]';</script>
