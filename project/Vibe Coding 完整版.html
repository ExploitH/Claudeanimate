  // ---------- Agent 循环 ----------
  function lapState(T, tm) {
    const L = tm.laps;

      th: Math.PI,
      run: false,
      i: -1

    for (let i = 0; i < L.length; i++) {
      const [a, b] = L[i];

        th: Math.PI * (1 + 2 * (i + (T - a) / (b - a))),
        run: true,
        i

    }
    return {
      th: Math.PI,
      run: false,
      i: L.length

      ctx.fillText(lab, lx, ly);
      ctx.textAlign = 'left';
      ctx.globalAlpha = a;
    });
    ctx.font = font(700, 64, MONO);

  // ---------- Chroma：输入越长越不稳 ----------

  // ---------- 章节卡与三个控制点 ----------

  // ---------- Clawd ----------
  function clawd(T, pl) {

  // ---------- 小工具 ----------
  function box(ctx, x, y, w, h, fill, stroke, lw = 2, r = 14, dash) {
    if (h < .5 || w < .5) return;
    ctx.fillStyle = fill;
    ctx.strokeStyle = stroke;
    ctx.lineWidth = lw;
    if (dash) ctx.setLineDash(dash);
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, Math.min(r, h / 2, w / 2));
    ctx.fill();
    ctx.stroke();
    ctx.setLineDash([]);
  }
  function win(ctx, x, y, w, h, title, tc) {
    box(ctx, x, y, w, h, COL.card, COL.line, 2, 16);
    ctx.fillStyle = COL.line;
    ctx.fillRect(x, y + 54, w, 1.5);
    for (let i = 0; i < 3; i++) {
      ctx.fillStyle = COL.faint;
      ctx.beginPath();
      ctx.arc(x + 28 + i * 20, y + 27, 6, 0, 6.283);
      ctx.fill();
    }
    ctx.font = font(500, 24);
    ctx.fillStyle = tc;
    ctx.textAlign = 'left';
    ctx.fillText(title, x + 100, y + 28);
  }
  function check(ctx, x, y, s, c) {
    ctx.strokeStyle = c;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(x - s, y);
    ctx.lineTo(x - s * .3, y + s * .7);
    ctx.lineTo(x + s, y - s * .7);
    ctx.stroke();
  }
  function cross(ctx, x, y, s, c) {
    ctx.strokeStyle = c;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(x - s, y - s);
    ctx.lineTo(x + s, y + s);
    ctx.moveTo(x + s, y - s);
    ctx.lineTo(x - s, y + s);
    ctx.stroke();
  }
  function chip(ctx, s, cx, cy, k, c, f = font(600, 26), fill = COL.bg, h = 48) {
    if (k <= .01) return;
    ctx.font = f;
    const w = ctx.measureText(s).width + 44;
    popScale(ctx, cx, cy, k, () => {
      box(ctx, cx - w / 2, cy - h / 2, w, h, fill, c, 2.5, h / 2);
      ctx.font = f;
      ctx.textAlign = 'center';
      ctx.fillStyle = c;
      ctx.fillText(s, cx, cy + 1);
      ctx.textAlign = 'left';
    });
  }
  const chipW = (ctx, s, f) => {
    ctx.font = f;
    return ctx.measureText(s).width + 44;
  };
  function arrow(ctx, x1, y, x2, k, c) {
    if (k <= 0) return;
    const x = lerp(x1, x2, k);
    ctx.strokeStyle = c;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(x1, y);
    ctx.lineTo(x - 6, y);
    ctx.stroke();
    ctx.fillStyle = c;
    ctx.beginPath();
    ctx.moveTo(x + 4, y);
    ctx.lineTo(x - 14, y - 11);
    ctx.lineTo(x - 14, y + 11);
    ctx.fill();
  }

  // ---------- 三件事 ----------
  function drawJobs(ctx, T, pl) {
    const {
        tm
      } = pl,
      a = fio(T, tm.Th, tm.Pk);
    if (a <= 0) return;

  // ---------- 查包 ----------
  function drawPkg(ctx, T, pl) {

  // ---------- METR ----------
  function dev(ctx, x, y, s, c) {
    ctx.fillStyle = c;
    ctx.fillRect(x - 14 * s, y - 14 * s, 28 * s, 22 * s);
    ctx.fillRect(x - 10 * s, y + 10 * s, 20 * s, 8 * s);
    ctx.fillStyle = COL.bg;
    ctx.fillRect(x - 8 * s, y - 6 * s, 5 * s, 6 * s);
    ctx.fillRect(x + 3 * s, y - 6 * s, 5 * s, 6 * s);
  }
  function bar(ctx, x, v, k, c, dash, fade = 0) {
    const h = v * AU * k,
      y = h > 0 ? AY - h : AY;
    if (Math.abs(h) < .5) return;
    ctx.fillStyle = rgba(c, (dash ? .14 : .35) * (1 - .5 * fade));
    ctx.strokeStyle = mixC(c, COL.faint, fade);
    ctx.lineWidth = 3;
    if (dash) ctx.setLineDash([10, 8]);
    ctx.beginPath();
    ctx.rect(x - 70, y, 140, Math.abs(h));
    ctx.fill();
    ctx.stroke();
    ctx.setLineDash([]);
  }
  function drawMetr(ctx, T, pl) {
    const {
        tm
      } = pl,
      end = pl.end || tm.Me + 24,
      a = fio(T, tm.Me, end);
    if (a <= 0) return;
    ctx.save();
    ctx.globalAlpha = a;
    chip(ctx, 'METR · 2025-07', 420, 200, prog(T, tm.metr, tm.metr + .45, MOTION.pop), COL.kw, font(600, 28, MONO));
    for (let i = 0; i < 16; i++) {
      const k = prog(T, tm.devs + i * .05, tm.devs + i * .05 + .35, MOTION.pop);
      if (k > .01) popScale(ctx, 270 + i % 4 * 100, 330 + Math.floor(i / 4) * 90, k, () => dev(ctx, 270 + i % 4 * 100, 330 + Math.floor(i / 4) * 90, 1.4, mixC(COL.fn, COL.type, hash(i * 2.1))));
    }
    ctx.globalAlpha = a * prog(T, tm.devs + .6, tm.devs + 1);
    ctx.font = font(500, 26);
    ctx.fillStyle = COL.dim;
    ctx.textAlign = 'center';
    ctx.fillText('16 位开源开发者', 420, 700);
    ctx.textAlign = 'left';
    const ka = prog(T, tm.axis, tm.axis + .7, MOTION.draw);
    ctx.globalAlpha = a;
    if (ka > 0) {
      ctx.fillStyle = '#5a5f6b';
      ctx.fillRect(760, AY - 2, 900 * ka, 4);
      ctx.font = font(400, 20, MONO);
      ctx.fillStyle = COL.faint;
      ctx.fillText('0%', 720, AY);
    }
    const k0 = prog(T, tm.b0, tm.b0 + 1, MOTION.draw),
      k1 = prog(T, tm.b1, tm.b1 + 1, MOTION.draw),
      k2 = prog(T, tm.b2, tm.b2 + 1, MOTION.draw),
      kb = prog(T, tm.bias, tm.bias + .5);
    bar(ctx, BX[0], -19, k0, COL.err);
    bar(ctx, BX[1], 20, k1, COL.fn);
    bar(ctx, BX[2], 18, k2, COL.type, true, kb);
    ctx.textAlign = 'center';
    const lab = (x, top, s, sub, k, c) => {
      if (k <= 0) return;
      ctx.globalAlpha = a * Math.min(1, k * 2);
      ctx.font = font(700, 40, MONO);
      ctx.fillStyle = c;
      ctx.fillText(s, x, top);
      ctx.font = font(500, 26);
      ctx.fillStyle = COL.dim;
      ctx.fillText(sub, x, AY + (top < AY ? 40 : -40));
    };
    lab(BX[0], AY + 19 * AU * k0 + 40, '−19%', '实际测量', k0, COL.err);
    lab(BX[1], AY - 20 * AU * k1 - 36, '+20%', '自我感觉', k1, COL.fn);
    lab(BX[2], AY - 18 * AU * k2 - 36, '+18%', '2026-02 更新', k2, mixC(COL.type, COL.faint, kb));
    ctx.textAlign = 'left';
    ctx.globalAlpha = a;
    chip(ctx, 'METR · 2026-02 更新', BX[2], 200, prog(T, tm.upd, tm.upd + .45, MOTION.pop), COL.type, font(600, 26, MONO), COL.card);
    if (kb > 0) {
      ctx.save();
      ctx.beginPath();
      ctx.rect(BX[2] - 70, AY - 18 * AU, 140, 18 * AU);
      ctx.clip();
      ctx.globalAlpha = a * kb * .5;
      ctx.strokeStyle = COL.num;
      ctx.lineWidth = 3;
      for (let x = -200; x < 200; x += 22) {
        ctx.beginPath();
        ctx.moveTo(BX[2] + x, AY);
        ctx.lineTo(BX[2] + x + 162, AY - 162);
        ctx.stroke();
      }
      ctx.restore();
    }
    chip(ctx, '选择偏差 · 不可靠', BX[2], AY + 110, prog(T, tm.bias, tm.bias + .45, MOTION.pop), COL.num, font(600, 26), COL.card);
    ctx.restore();
  }
  function scene(ctx, T, pl, fv) {
    const {
      tm
    } = pl;
    if (T < tm.Ok) return drawCard(ctx, T, pl, fv);
    if (T < tm.Fk) return drawDiff(ctx, T, pl);
    if (T < tm.Hl) return drawCheats(ctx, T, pl);
    if (T < tm.Sq) return drawFake(ctx, T, pl);
    if (T < tm.Th) return drawSquat(ctx, T, pl);
    if (T < tm.Pk) return drawJobs(ctx, T, pl);
    if (T < tm.Me) return drawPkg(ctx, T, pl);
    drawMetr(ctx, T, pl);
  }

  // ---------- Clawd ----------
  function clawd(T, pl) {
    const {
        tm
      } = pl,
      prev = pl.prev || [960, 600, 12];
    const J = [[tm.S - .55, tm.S + .35, prev, C0], [tm.Ok - .1, tm.Ok + .6, C0, COk], [tm.back, tm.back + .6, COk, CDf], [tm.Fk - .2, tm.Fk + .5, CDf, CFk], [tm.Sq - .2, tm.Sq + .5, CFk, CSq], [tm.Th - .2, tm.Th + .5, CSq, CTh], [tm.Pk - .2, tm.Pk + .5, CTh, CPk], [tm.Me - .2, tm.Me + .5, CPk, CMe]];
    const r = jumpPos(T, J, prev),
      [x, y, px] = r.p;
    const st = {
      x,
      y,
      px,
      pose: 'idle',
      ph: T * 14,
      walk: -1,
      eye: 0,
      blink: T % 3.3 < .12,
      squash: 1,
      alpha: 1
    };
    if (r.air) st.squash = 1 + .1 * Math.sin(Math.PI * r.k);
    const ld = J.map(j => j[1]).find(t => T >= t && T < t + .25);
    if (ld !== undefined) st.squash = 1 - .2 * Math.sin(Math.PI * (T - ld) / .25);
    const nod = (t, d = 1.3) => {
      if (T >= t && T < t + d) st.nod = Math.sin((T - t) * 5) > .3;
    };
    if (T >= tm.S + .35 && T < tm.Ok - .1) st.eye = 1;
    if (T >= tm.sign - .1 && T < tm.Fk - .2) st.pose = 'up';
    if (T >= tm.back + .6 && T < tm.ring) st.eye = -1;
    if (T >= tm.whis && T < tm.Fk - .2) {
      st.eye = 1;
      st.nod = false;
    }
    if (T >= tm.Fk + .5 && T < tm.Sq - .2) st.eye = -1;
    tm.ch.forEach(t => nod(t + .4, .8));
    if (T >= tm.us && T < tm.Hl - .1) {
      st.pose = 'cover';
      st.sweat = T - tm.us;
    }
    if (T >= tm.fk[3] + .5 && T < tm.fk[3] + 2) st.q = qk(T, tm.fk[3] + .5, 1.5);
    if (T >= tm.Sq + .5 && T < tm.Th - .2) {
      st.eye = -1;
      if (T >= tm.bad) {
        st.eye = -1;
        st.sweat = T - tm.bad;
      }
    }
    if (T >= tm.done - .1 && T < tm.job[0]) st.pose = 'up';
    if (T >= tm.job[0] && T < tm.Pk - .2) st.eye = 1;
    if (T >= tm.Pk + .5 && T < tm.Me - .2) st.eye = -1;
    tm.pk.forEach(t => nod(t + .2, .6));
    if (T >= tm.Me + .5) st.eye = -1;
    if (T >= tm.b1 + 1 && T < tm.b1 + 2) st.q = qk(T, tm.b1 + 1, 1);
    if (T >= tm.bias && T < tm.bias + 1.4) st.sweat = T - tm.bias;
    return st;
  }

  // ---------- 演员层：举牌、口哨、陌生账号 ----------
  function sign(ctx, st, s, c, k, tilt = 0, over) {
    if (k <= .01) return;
    const sc = st.px / 11,
      hx = st.x + 4 * st.px,
      top = st.y - 8 * st.px;
    ctx.save();
    ctx.translate(hx, top);
    ctx.rotate(tilt);
    ctx.scale(sc * k, sc * k);
    ctx.fillStyle = '#7a5a40';
    ctx.fillRect(-4, -120, 8, 120);
    ctx.font = font(700, 40);
    const w = ctx.measureText(s).width + 60;
    box(ctx, -w / 2, -200, w, 90, COL.card, c, 4, 12);
    ctx.fillStyle = c;
    ctx.textAlign = 'center';
    ctx.fillText(s, 0, -154);
    if (over) over(w);
    ctx.restore();
  }
  function note(ctx, x, y, s, c) {
    ctx.fillStyle = c;
    ctx.fillRect(x, y - 30 * s, 5 * s, 30 * s);
    ctx.fillRect(x, y - 30 * s, 16 * s, 6 * s);
    ctx.fillRect(x - 10 * s, y - 4 * s, 15 * s, 11 * s);
  }
  function stranger(T, pl) {
    const {
        tm
      } = pl,
      r = jumpPos(T, [[tm.bad, tm.bad + .7, [2080, 820, 12], [1340, 820, 12]], [tm.grab - .35, tm.grab, [1340, 820, 12], [1180, 800, 12]]], [2080, 820, 12]),
      [x, y, px] = r.p;
    const st = {
      x,
      y,
      px,
      pose: 'idle',
      ph: T * 14,
      walk: -1,
      eye: -1,
      blink: false,
      squash: 1,
      alpha: 1 - prog(T, tm.Th - .5, tm.Th)
    };
    if (r.air) st.squash = 1 + .1 * Math.sin(Math.PI * r.k);
    if (T >= tm.grab && T < tm.grab + .25) st.squash = 1 - .2 * Math.sin(Math.PI * (T - tm.grab) / .25);
    if (T >= tm.grab - .1 && T < tm.grab + .6) st.pose = 'push';
    return st;
  }
  function drawStranger(ctx, st) {
    if (st.alpha <= 0) return;
    const a = COL.clawd,
      b = COL.clawdHi;
    COL.clawd = '#4a4e57';
    COL.clawdHi = '#61656f';
    try {
      drawClawd(ctx, st);
    } finally {
      COL.clawd = a;
      COL.clawdHi = b;
    }
    const {
        px
      } = st,
      x = st.x - .4 * px,
      gy = st.y - 6.1 * px;
    ctx.save();
    ctx.globalAlpha = st.alpha;
    ctx.fillStyle = '#0b0b0e';
    ctx.fillRect(x - 3.7 * px, gy, 3.2 * px, 2.1 * px);
    ctx.fillRect(x + 1.5 * px, gy, 3.2 * px, 2.1 * px);
    ctx.fillRect(x - .6 * px, gy + .3 * px, 2.2 * px, .5 * px);
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    ctx.fillRect(x - 3.3 * px, gy + .3 * px, .7 * px, .5 * px);
    ctx.fillRect(x + 1.9 * px, gy + .3 * px, .7 * px, .5 * px);
    ctx.restore();
  }
  function over(ctx, T, pl) {
    const {
      tm
    } = pl;
    ctx.textBaseline = 'middle';
    if (T >= tm.sign - .1 && T < tm.Fk) {
      const st = clawd(T, pl),
        k = prog(T, tm.sign, tm.sign + .5, MOTION.pop) * (1 - prog(T, tm.Fk - .5, tm.Fk - .2)),
        tilt = T >= tm.whis ? -.12 + .03 * Math.sin(T * 3) : 0;
      const ks = prog(T, tm.seem, tm.seem + .3, Easing.easeOutQuad);
      sign(ctx, st, '全部通过 ✓', COL.str, k, tilt, ks > 0 ? w => stamp(ctx, '看起来', w / 2 - 30, -214, ks, COL.num, .14, 30) : null);
      if (T >= tm.whis) for (let i = 0; i < 3; i++) {
        const ph = ((T - tm.whis) * .7 + i / 3) % 1;
        ctx.globalAlpha = Math.sin(Math.PI * ph) * k;
        note(ctx, st.x + 6 * st.px + 20 + ph * 90, st.y - 5 * st.px - ph * 110 + Math.sin(ph * 9) * 10, .9, COL.type);
        ctx.globalAlpha = 1;
      }
    }
    if (T >= tm.done - .1 && T < tm.job[0] + .3) {
      const st = clawd(T, pl),
        k = prog(T, tm.done, tm.done + .45, MOTION.pop) * (1 - prog(T, tm.job[0] - .2, tm.job[0] + .2));
      sign(ctx, st, '完成了', COL.str, k);
    }
    if (T >= tm.bad && T < tm.Th) drawStranger(ctx, stranger(T, pl));
  }

  // ---------- 着色器参数 ----------
  function fx(T, pl) {
    const {
        tm
      } = pl,
      card = 1 - prog(T, tm.Ok - .6, tm.Ok, Easing.linear);
    let gl = 0;
    const sp = (t, a, d) => {
      if (T >= t) gl = Math.max(gl, a * Math.exp(-(T - t) * d));
    };
    sp(tm.ring + .6, .35, 6);
    sp(tm.us, .2, 6);
    sp(tm.bad, .3, 5);
    sp(tm.grab, .45, 5);
    sp(tm.evil, .4, 4);
    sp(tm.bias, .3, 6);
    let rays = 0,
      light = [.5, .44];
    if (T < tm.Ok) {
      rays = .5 * bump(T, tm.dots + 1.2, .45);
      light = [1080 / 1920, 480 / 1080];
    } else if (T < tm.Fk) {
      rays = .45 * bump(T, tm.sign + .5, .5);
      light = [COk[0] / 1920, 330 / 1080];
    } else if (T >= tm.Hc && T < tm.Hl) {
      rays = .3 * bump(T, tm.link + .5, .5);
      light = [990 / 1920, 470 / 1080];
    } else if (T >= tm.Pk && T < tm.Me) {
      rays = .3 * bump(T, tm.pk[2] + .4, .5);
      light = [960 / 1920, 540 / 1080];
    }
    return {
      gl,
      rays,
      light,
      energy: lerp(.38, 1, card) + .15 * bump(T, tm.sign + .4, .5),
      warm: .15 + .3 * bump(T, tm.ring + .8, .8) + .5 * prog(T, tm.bad, tm.bad + .6) * (1 - prog(T, tm.Th - .6, tm.Th)) + .25 * bump(T, tm.b0 + 1, .8),
      floor: Math.max(.65 * card, .5 * prog(T, tm.Me + 7, tm.Me + 8))
    };
  }

  // 时间轴上的合并段落 → 章内小节（作者时长）
  const TL_PARTS = {
    "08 章节卡 · 全部通过 · diff": [["08 章节卡", 3.5], ["08 全部通过", 10.5], ["08 diff", 7]],
    "08 假完成 · 写死": [["08 假完成", 15], ["08 写死", 9.5]],
    "08 编造 · 抢注": [["08 编造", 6], ["08 抢注", 19.5]],
    "08 三件事 · 查包 · METR": [["08 三件事", 12], ["08 查包", 9.5], ["08 METR", 24]]

  // ---------- Clawd ----------
  function clawd(T, pl) {
    const {
        tm
      } = pl,
      prev = pl.prev || [960, 600, 12];
    const J = [[tm.S - .55, tm.S + .35, prev, C0], [tm.Pw - .1, tm.Pw + .6, C0, CPw], [tm.Lk + 16.2 - .2, tm.Lk + 16.2 + .5, CPw, CBar], [tm.Rv - .2, tm.Rv + .5, CBar, CRv], [tm.Cs - .2, tm.Cs + .5, CRv, CCs], [tm.Po - .2, tm.Po + .5, CCs, CPo], [tm.Ky - .2, tm.Ky + .5, CPo, CKy], [tm.Cf - .2, tm.Cf + .5, CKy, CCf], [tm.inSb - .4, tm.inSb + .2, CCf, CSb], [tm.Ij - .2, tm.Ij + .5, CSb, CIj], [tm.Dn - .2, tm.Dn + .5, CIj, CDn]];
    const r = jumpPos(T, J, prev),
      [x, y, px] = r.p;
    const st = {
      x,
      y,
      px,
      pose: 'idle',
      ph: T * 14,
      walk: -1,
      eye: 0,
      blink: T % 3.3 < .12,
      squash: 1,
      alpha: 1

    if (r.air) st.squash = 1 + .1 * Math.sin(Math.PI * r.k);
    const ld = J.map(j => j[1]).find(t => T >= t && T < t + .25);
    if (ld !== undefined) st.squash = 1 - .2 * Math.sin(Math.PI * (T - ld) / .25);
    const nod = (t, d = 1.3) => {
      if (T >= t && T < t + d) st.nod = Math.sin((T - t) * 5) > .3;
    };
    if (T >= tm.S + .35 && T < tm.Pw - .1) st.eye = 1;
    if (T >= tm.typ0 && T < tm.typ1) {
      st.pose = 'type';
      st.ph = T * 22;
      st.eye = -1;
    }
    if (T >= tm.typ1 && T < tm.Lk + 16) st.eye = -1;
    if (T >= tm.pwd && T < tm.Lk) st.sweat = T - tm.pwd;
    if (T >= tm.cover && T < tm.Rv - .2) {
      st.pose = 'cover';
      st.sweat = T - tm.cover;
    }
    if (T >= tm.Rv + .5 && T < tm.Po - .2) st.eye = -1;
    if (T >= tm.ours && T < tm.ours + 1.2) st.pose = 'point';
    if (T >= tm.Po + .5 && T < tm.why) {
      st.eye = T < tm.vol ? -1 : 1;
      if (T >= tm.boom1) st.sweat = T - tm.boom1;
    }
    if (T >= tm.boom2 && T < tm.boom2 + 1.6) st.q = qk(T, tm.boom2 + .2, 1.4);
    if (T >= tm.Ky + .5 && T < tm.Cf - .2) st.eye = 1;
    nod(tm.lock);
    nod(tm.hit + .3);
    if (T >= tm.Cf + .5 && T < tm.inSb - .4) st.eye = -1;
    if (T >= tm.dlg && T < tm.ok + .2) st.pose = 'up';
    nod(tm.ok + .2);
    nod(tm.inSb + .3);
    if (T >= tm.Ij + .5 && T < tm.Dn - .2) st.eye = -1;
    if (T >= tm.lens && T < tm.lure + .4) st.pose = 'point';
    if (T >= tm.find && T < tm.find + 1.6) st.sweat = T - tm.find;
