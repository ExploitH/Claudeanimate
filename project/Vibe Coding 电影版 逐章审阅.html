// f10b 回声：副歌八小节，每小节翻进一章的画风，Clawd 跟着换装、旁边是那一章的标志物；清单八条，每条落在它那一章的画风里，最后转正停住
// f10c 现实：周一早上，天亮了，便利贴划掉，作业交了；Clawd 道别，合上屏幕，镜头退回窗外
// f10d 片尾：清单逐条打勾，来源，信息截至 2026 年 10 月；音乐盒、两下心跳、光标闪两下熄灭
(() => {
  const R = window.MV_W = window.MV_W || {};
  const RULES = ['先判断这个项目在轴的哪一端', '提示词写清目标、背景、约束、验收标准', '规则文件自己写，写短', '按任务选模型，按任务算费用', '弄清工具的权限设置和撤销方式', '先出计划，小步提交', '看 diff、自己运行、确认依赖真实存在', '密钥不进代码，危险命令手动确认'];
  const RULE_CH = ['01', '03', '04', '05', '06', '07', '08', '09'];
  const SOURCES = ['Karpathy, 2025-02', 'Collins Dictionary, 2025-11', 'Simon Willison', 'Chroma, Context Rot, 2025-07', 'Anthropic, Prompting best practices', 'Gloaguen et al., ETH Zurich / ICLR 2026', 'Princeton HAL / Sayash Kapoor, 2025-12', 'RedAccess via Security Boulevard, 2026-05', 'Churilov via InfoWorld, 2026-04', 'METR, 2025-07 & 2026-02', 'GitGuardian 2026', 'Veracode 2026', 'TechCentral, 2026-04'];

  // ======================================================================
  R.f10a = K => window.MV_REAL(K, {
    scene: '10 · 03:00 能跑，也能讲清',
    desc: '凌晨三点，你自己看过 diff、跑过测试，也讲得清每一步在干什么；Clawd 说这回是真的做完了。',
    clock: [3, 0],
    stamp: ['周六', '03:00'],
    steps: [{
      pause: .75
    }, {
      id: 'run',
      you: '能跑了。diff 看过，测试也自己跑过了。'
    }, {
      id: 'ok',
      me: '四个测试，全部通过。这回是真的。'
    }, {
      id: 'explain',
      you: '每一步在干什么，我也讲得清了。'
    }, {
      id: 'done',
      me: '那今晚就没白熬。',
      wait: .5
    }, {
      id: 'quiet',
      pause: 2.75
    }, {
      id: 'push',
      pause: 1.6
    }],
    shots: S => [[0, 'wide', 0], [S.t('run') - .2, 'over', 1.2], [S.t('ok'), 'screen', 0], [S.t('explain'), 'face', 1.2], [S.t('quiet'), 'clock', 1.4], [S.t('quiet') + 1.8, 'desk', 1], [S.t('push'), 'into', 1.5, 'in']],
    chatHide: S => S.t('quiet') + 1.6,
    room: () => ({
      steam: .05,
      rain: .35
    }),
    mood: () => [.6, .5, .85, .7],
    codeOverlay: (x, w, h, L, S) => {
      const k = K.prog(L.b, S.t('run') + .4, S.t('run') + .6);
      if (k <= 0) return;
      x.globalAlpha = k;
      x.fillStyle = '#0c0d10';
      x.fillRect(0, h - 200, w, 200);
      x.fillStyle = '#2a2c33';
      x.fillRect(0, h - 200, w, 2);
      x.font = '500 17px "JetBrains Mono",monospace';
      ['$ git diff --stat', '  4 files changed, 86 insertions(+), 3 deletions(-)', '$ mvn test'].forEach((s, i) => {
        x.fillStyle = '#e8e9ee';
        x.fillText(s, 20, h - 168 + i * 30);
      });
      if (L.b >= S.t('ok')) {
        x.fillStyle = '#7ee0a0';
        x.fillText('Tests run: 4, Failures: 0  ✓', 20, h - 168 + 3 * 30);
      }
      x.globalAlpha = 1;
    },
    figure: (L, S) => ({
      type: L.b >= S.t('run') && L.b < S.t('run') + .8 || L.b >= S.t('explain') && L.b < S.t('explain') + .7 ? 1 : 0,
      lean: -.2 * K.prog(L.b, S.t('done'), S.t('done') + .6)
    }),
    sfx: S => [[S.t('ok') + .6, 'ding'], [S.t('quiet') + .3, 'tock'], [S.t('quiet') + .8, 'tock'], [S.t('quiet') + 1.3, 'tock'], [S.t('push'), 'swoosh3d']],
    music(S, H, w) {
      const M = w.m.S;
      S.add('rain', 0, 0, 0, w.m.bars * 4, .35);
      S.add('pad', 0, 0, H.CH.F.pad, 8, .3, 'warm');
      S.add('pad', Math.floor(M.t('explain')), 0, H.CH.C.pad, 8, .32, 'warm');
      S.add('riser', Math.floor(M.t('push')), 0, 0, 6, .6);
    }
  });

  // ======================================================================
  R.f10b = K => {
    const {
      F,
      C,
      E,
      TR,
      LOOK,
      prog,
      lerp,
      hash,
      rgba,
      mixC,
      fnt,
      rr,
      circ,
      seg,
      arrow,
      txt,
      tw,
      scaleAt,
      rotAt,
      alpha,
      clawd,
      seq,
      narrate,
      scene,
      sing
    } = K;
    // 每个世界：[画风, 画风参数, 字体, 字色, 强调色, 卡片底色, Clawd 打扮, 亮底？]
    const W = {
      dream: [LOOK.DREAM, [1, 0, .7, 0], F.serif, '#fff6ff', '#ffd38a', 'rgba(40,18,60,.78)', {
        skin: 'glow',
        col: '#ff7d55',
        hi: '#ffa27f',
        glow: '#ff5fa8'
      }],
      orbit: [LOOK.ORBIT, [.5, .45, .95, .05], F.sans, '#eef3ff', '#9fd8ff', 'rgba(8,12,30,.85)', {
        hat: 'helmet'
      }],
      riso: [LOOK.RISO, [.8, 1, 0, 0], F.poster, '#2a4fd0', '#ff3d9a', '#f3ecdc', {
        col: '#ff6a2a',
        hi: '#ff9a6a'
      }, 1],
      paper: [LOOK.PAPER, [1, .3, 0, 0], F.sans, '#2b2d42', '#e07a5f', '#f7f0e1', {
        skin: 'paper',
        col: '#e07a5f',
        hi: '#ef9a7f',
        line: '#f7f0e1'
      }, 1],
      neon: [LOOK.NEON, [.5, 1.2, .55, .5], F.sans, '#ffe8fb', '#3ef0ff', 'rgba(20,6,30,.86)', {
        skin: 'neon',
        col: '#ff4fb8',
        glow: '#ff4fb8'
      }],
      print: [LOOK.PRINT, [.12, 0, 0, 0], F.sans, '#eaf4ff', '#ffd75e', 'rgba(14,40,90,.9)', {
        skin: 'wire',
        col: '#ffd75e'
      }],
      pixel: [LOOK.PIXEL, [6, 1, 1.5, 0], F.sans, '#fff1e8', '#ffec27', '#1d2b53', {
        col: '#ffa300',
        hi: '#ffccaa',
        eyeC: '#000',
        hat: 'cap8',
        hatC: '#ff004d'
      }],
      noir: [LOOK.NOIR, [1, .9, 0, 0], F.serif, '#2a2a2a', '#e0242f', '#e9e6de', {
        hat: 'fedora'
      }, 0],
      alert: [LOOK.ALERT, [.06, .4, 1, 0], F.sans, '#ffffff', '#3ff0d0', 'rgba(6,18,18,.9)', {}]
    };
    const CHORUS = ['dream', 'orbit', 'riso', 'paper', 'neon', 'print', 'pixel', 'noir'];
    const LISTW = ['dream', 'riso', 'paper', 'neon', 'print', 'pixel', 'noir', 'alert'];
    const S = seq([{
      id: 'in',
      pause: 1.75
    }, {
      id: 'ref',
      pause: 8.25
    }, {
      id: 'list0',
      say: '今晚这八条，收成一张清单：'
    }, ...RULES.map((r, i) => ({
      id: 'r' + i,
      say: r + '。',
      hold: .5
    })), {
      id: 'settle',
      pause: 2
    }], {
      start: .25,
      tail: .25
    });
    const t = S.t;
    const R0 = Math.ceil(t('ref'));
    const RT = RULES.map((_, i) => t('r' + i));
    // 当前在哪个世界
    const worldAt = b => {
      if (b >= R0 && b < R0 + 8) return CHORUS[Math.floor(b - R0)];
      if (b >= RT[0] - .1 && b < t('settle') + .2) {
        let i = 0;
        RT.forEach((a, j) => {
          if (b >= a - .1) i = j;
        });
        return LISTW[i];
      }
      return null;
    };
    const light = b => {
      const w = worldAt(b);
      return w && W[w][7];
    };
    // 每个世界的标志物（片里那一章出现过的东西）
    function motif(cx, tx, name, k, tt) {
      const [,, fam, ink, acc] = W[name];
      alpha(cx, k, () => alpha(tx, k, () => {
        if (name === 'dream') {
          seg(cx, 560, 700, 560 + 800 * k, 700, ink, 5);
          [['作业', .2], ['给别人用', .6], ['上线', 1]].forEach(([n, p]) => {
            if (k >= p) {
              cx.fillStyle = ink;
              cx.fillRect(560 + 800 * p - 4, 680, 8, 40);
              txt(tx, n, 560 + 800 * p, 750, fnt(800, 32, fam), ink, 'center');
            }
          });
        }
        if (name === 'orbit') {
          circ(cx, 960, 690, 120, null, acc, 4);
          for (let i = 0; i < 4; i++) {
            const a = tt * .8 + i * 1.571;
            circ(cx, 960 + Math.cos(a) * 120, 690 + Math.sin(a) * 120, 12, ink);
          }
          txt(tx, '上下文窗口', 960, 690, fnt(800, 30, fam), ink, 'center');
        }
        if (name === 'riso') ['目标', '背景', '约束', '验收'].forEach((n, i) => {
          const kk = prog(k, i * .15, i * .15 + .4, E.back);
          scaleAt(cx, 615 + i * 230, 700, kk, () => rr(cx, 535 + i * 230, 640, 160, 120, 4, ['#2a4fd0', '#14a05a', '#ff6a2a', '#ff3d9a'][i]));
          if (kk > .5) txt(tx, n, 615 + i * 230, 700, fnt(900, 40, fam), '#ffffff', 'center');
        });
        if (name === 'paper') {
          for (let i = 0; i < 4; i++) rotAt(cx, 960, 700 - i * 22, (i - 1.5) * .03, () => rr(cx, 760, 660 - i * 22, 400, 90, 4, i === 0 ? '#e8b04a' : '#fffaf0', '#2b2d42', 2));
          txt(tx, 'AGENTS.md', 960, 708, fnt(700, 30, F.mono), ink, 'center');
        }
        if (name === 'neon') {
          cx.save();
          cx.shadowColor = acc;
          cx.shadowBlur = 16;
          cx.strokeStyle = '#b45cff';
          cx.lineWidth = 6;
          cx.beginPath();
          cx.ellipse(960, 700, 300, 110, 0, 0, 6.283);
          cx.stroke();
          [[tt * 1.6, acc], [tt * .9 + 2, '#ff4fb8']].forEach(([a, c]) => {
            cx.fillStyle = c;
            cx.shadowColor = c;
            cx.fillRect(960 + Math.cos(a) * 300 - 18, 700 + Math.sin(a) * 110 - 9, 36, 18);
          });
          cx.restore();
        }
        if (name === 'print') {
          cx.strokeStyle = ink;
          cx.lineWidth = 3;
          cx.beginPath();
          cx.moveTo(700, 740);
          cx.lineTo(700, 700);
          cx.lineTo(790, 680);
          cx.lineTo(860, 620);
          cx.lineTo(1060, 620);
          cx.lineTo(1130, 680);
          cx.lineTo(1220, 700);
          cx.lineTo(1220, 740);
          cx.closePath();
          cx.stroke();
          [800, 1120].forEach(x => circ(cx, x, 745, 44, 'rgba(18,58,122,1)', ink, 3));
          cx.strokeStyle = acc;
          cx.strokeRect(910, 650, 100, 60);
          txt(tx, '模型', 960, 680, fnt(800, 24, fam), acc, 'center');
        }
        if (name === 'pixel') {
          [0, 1, 2].forEach(i => {
            const x = 760 + i * 200;
            cx.fillStyle = '#29adff';
            cx.fillRect(x - 36, 664, 72, 72);
            cx.fillStyle = '#fff1e8';
            cx.fillRect(x - 24, 664, 48, 24);
            cx.fillStyle = '#c2c3c7';
            cx.fillRect(x - 24, 700, 48, 30);
          });
          txt(tx, 'SAVE', 960, 780, fnt(400, 30, F.pixel), acc, 'center');
        }
        if (name === 'noir') {
          rotAt(cx, 960, 700, -.04, () => {
            rr(cx, 720, 620, 480, 170, 2, '#e9e6de');
          });
          rotAt(tx, 960, 700, -.04, () => {
            txt(tx, '测试全部通过 ✓', 900, 690, fnt(900, 40, F.serif), '#2a2a2a', 'center');
            rr(tx, 1040, 700, 130, 60, 4, null, acc, 5);
            txt(tx, '待查', 1105, 731, fnt(900, 34, F.serif), acc, 'center');
          });
        }
      }));
    }
    return scene({
      scene: '10 回声 · 清单',
      desc: '副歌八小节，每小节翻进一章的画风，Clawd 跟着换装，旁边是那一章的标志物；然后八条规则落进一张清单，每条用它那一章的画风，最后清单转正停住。',
      look: L => {
        const w = worldAt(L.b);
        return w ? W[w][0] : LOOK.PRISM;
      },
      enter: {
        kind: TR.FLASH,
        a: 0,
        b: .5,
        flash: .8
      },
      hud: {
        num: '10',
        name: '清单',
        time: '03:00',
        line: '能跑，也能讲清',
        small: true,
        ink: L => light(L.b) ? '#1f1b2e' : '#ffffff',
        acc: C.clawd
      },
      par: L => {
        const w = worldAt(L.b);
        return w ? W[w][1] : [.6 + .4 * prog(L.b, 0, R0), 0, 0, 0];
      },
      cam: L => {
        if (L.b >= R0 && L.b < R0 + 8) {
          const k = L.b % 1;
          return [1.04 - .04 * E.out(Math.min(1, k * 3)), 0, 0, 0];
        }
        return [1, 0, 0, 0];
      },
      flash: L => L.b >= R0 && L.b < R0 + 8 ? .45 * Math.exp(-(L.b % 1) * 16) : 0,
      pulse: L => L.b >= R0 && L.b < R0 + 8 ? 1 : .4,
      sfx: [[.2, 'chime', 1319], [R0, 'sparkle'], ...CHORUS.map((_, i) => [R0 + i, 'swish']), ...RT.flatMap((a, i) => [[a + .05, 'stamp'], [a + .1, 'blip', 900 + i * 90]]), [t('settle') + .3, 'rule']],
      text: RULES.join('') + RULE_CH.join('') + 'Vibe Coding 清单作业给别人用上线上下文窗口目标背景约束验收AGENTS.md模型SAVE测试全部通过 ✓待查第章',
      draw(cx, tx, L) {
        const b = L.b,
          tt = L.t;
        // ---------- 开场：安静的回声 ----------
        if (b < R0) {
          const k = prog(b, .2, .8) * (1 - prog(b, R0 - .3, R0));
          alpha(tx, k, () => {
            txt(tx, '03:00', 960, 420, fnt(700, 180, F.mono), rgba('#ffffff', .12 + .04 * Math.sin(tt * 3)), 'center');
            txt(tx, '今晚的事，再唱一遍。', 960, 600, fnt(800, 56, F.serif), '#f4f1ea', 'center');
          });
          clawd(cx, {
            x: 960,
            y: 860,
            px: 14,
            pose: 'idle',
            ph: tt * 6,
            blink: tt % 2.4 < .2,
            eye: 0,
            alpha: k
          });
        }
        // ---------- 副歌：每小节一个世界 ----------
        if (b >= R0 - .05 && b < R0 + 8.3) {
          const i = Math.max(0, Math.min(7, Math.floor(b - R0))),
            name = CHORUS[i],
            [,, fam, ink, acc] = W[name],
            lb = (b - R0) % 1;
          motif(cx, tx, name, prog(lb, .05, .45, E.out) * (1 - prog(b, R0 + 8, R0 + 8.3)), tt);
          const jump = Math.sin(Math.min(1, lb * 2.2) * Math.PI) * 70;
          clawd(cx, {
            x: 1560,
            y: 880 - jump,
            px: 16,
            pose: lb < .5 ? 'up' : 'idle',
            ph: tt * 10,
            blink: false,
            eye: 0,
            eyeShape: 'happy',
            ...W[name][6]
          });
          const lc = name === 'noir' ? '#f2efe8' : ink;
          sing(tx, L, {
            at: R0,
            x: 960,
            y: 330,
            size: 84,
            col: lc,
            dim: rgba(lc, name === 'pixel' ? .55 : .25),
            glow: acc,
            fam,
            hold: 8.15
          });
        }
        // ---------- 清单 ----------
        const kl = prog(b, t('list0'), t('list0') + .4, E.out);
        if (kl > 0) {
          let wi = 0;
          RT.forEach((a, j) => {
            if (b >= a - .1) wi = j;
          });
          const name = b >= RT[0] - .1 ? LISTW[wi] : 'dream',
            [,, fam, ink, acc, bg] = W[name];
          const settle = prog(b, t('settle'), t('settle') + 1.2, E.io),
            rot = (1 - settle) * (wi % 2 ? .018 : -.018) * (b >= RT[0] ? 1 : 0);
          const X = 330,
            Y = 130,
            Wd = 1260,
            Hd = 790;
          alpha(cx, kl, () => alpha(tx, kl, () => {
            rotAt(cx, 960, 525, rot, () => {
              rr(cx, X, Y + (1 - kl) * 40, Wd, Hd, name === 'pixel' ? 0 : 18, bg, rgba(acc, .6), 3);
              if (name === 'print') {
                cx.strokeStyle = rgba(ink, .12);
                cx.lineWidth = 1;
                for (let x = X + 40; x < X + Wd; x += 40) {
                  cx.beginPath();
                  cx.moveTo(x, Y);
                  cx.lineTo(x, Y + Hd);
                  cx.stroke();
                }
              }
            });
            rotAt(tx, 960, 525, rot, () => {
              txt(tx, 'Vibe Coding', X + 60, Y + 72, fnt(700, 44, F.mono), ink);
              txt(tx, '清单', X + 400, Y + 72, fnt(900, 44, fam), acc);
              seg(tx, X + 60, Y + 118, X + Wd - 60, Y + 118, rgba(ink, .25), 2);
              RULES.forEach((r, i) => {
                const ki = prog(b, RT[i], RT[i] + .25, E.out);
                if (ki <= 0) return;
                const y = Y + 180 + i * 76 - (1 - ki) * 30,
                  cur = i === wi && b < t('settle');
                alpha(tx, ki, () => {
                  if (cur) {
                    tx.fillStyle = rgba(acc, .18);
                    tx.fillRect(X + 40, y - 34, Wd - 80, 68);
                  }
                  txt(tx, String(i + 1), X + 80, y, fnt(800, 34, F.mono), acc, 'center');
                  txt(tx, r, X + 130, y, fnt(cur ? 900 : 700, 36, fam), ink);
                  txt(tx, '第 ' + RULE_CH[i] + ' 章', X + Wd - 60, y, fnt(500, 24, F.sans), rgba(ink, .5), 'right');
                });
              });
            });
          }));
          if (b >= RT[0] - .1) {
            const hop = Math.sin(Math.min(1, prog(b, RT[wi], RT[wi] + .4)) * Math.PI) * 60;
            clawd(cx, {
              x: 1740,
              y: 900 - hop,
              px: 13,
              pose: b >= t('settle') ? 'both' : 'pointL',
              ph: tt * 10,
              blink: tt % 3 < .1,
              eye: -1,
              eyeShape: b >= t('settle') ? 'happy' : null,
              ...W[name][6]
            });
          } else clawd(cx, {
            x: 1740,
            y: 900,
            px: 13,
            pose: 'idle',
            ph: tt * 10,
            eye: -1,
            alpha: kl
          });
        }
        narrate(tx, L, S, {
          sub: {
            y: 1000,
            size: 38,
            col: light(b) ? '#1f1b2e' : '#ffffff',
            shadow: light(b) ? 'rgba(255,255,255,.9)' : 'rgba(0,0,0,1)'
          }
        });
      },
      music(Sm, H, w) {
        const B = w.m.bars,
          PD = H.PD,
          CH = H.CH;
        Sm.add('pad', 0, 0, CH.F.pad, R0 * 4, .35, 'glass');
        H.roll(Sm, R0 - 1, 2, 4, 'snare', 'gated', .2, .8, .25);
        Sm.add('crash', R0, 0, 0, 0, .85);
        H.hook(Sm, R0, 'saw', 0, 0, 8, .95);
        H.each(R0, R0 + 8, b => {
          for (let j = 0; j < 4; j++) Sm.add('kick', b, j, 0, 0, .85, 'main');
          Sm.add('snare', b, 1, 0, 0, .65, 'gated');
          Sm.add('snare', b, 3, 0, 0, .65, 'gated');
          const c = CH[PD[(b - R0) % 4]];
          Sm.add('pad', b, 0, c.pad, 4, .55, 'warm');
          Sm.add('bass', b, 0, c.r, 3.5, .7, '808');
        });
        H.hats(Sm, R0, R0 + 8, .5, .2, true, true);
        const L0 = R0 + 8;
        H.each(L0, B, b => {
          const c = CH[PD[(b - L0) % 4]];
          Sm.add('pad', b, 0, c.pad, 4, .45, 'warm');
          Sm.add('kick', b, 0, 0, 0, .5, 'soft');
          Sm.add('kick', b, 2, 0, 0, .4, 'soft');
          Sm.add('snare', b, 3, 0, 0, .35, 'lofi');
          for (let j = 0; j < 8; j++) Sm.add('chiparp', b, j / 2, c.arp[j % 4], .4, .3);
        });
        RT.forEach((a, i) => Sm.add('bell', Math.floor(a), a % 1 * 4, [72, 74, 76, 77, 79, 81, 83, 84][i], 2, .45));
      }
    }, S);

  const tn = (t, f, len, peak, type = 'sine', f2, a = .004) => {
    const o = O(type, f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + len);
    const g = G();
    perc(g, t, peak, a, len);
    o.connect(g);
    o.stop(t + a + len + .05);
    return g;
  };
  const vib = (o, t, rate, cents, delay = .2) => {
    const l = O('sine', rate, t);
    const g = G();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(cents, t + delay + .3);
    l.connect(g);
    g.connect(o.detune);
    return l;
  };

  // ---------- 乐器 ----------
  const I = {
    kick(e, t) {
      const k = e.x || 'main',
        v = e.v;
      if (k === 'heart') {
        const o = O('sine', 75, t);
        o.frequency.exponentialRampToValueAtTime(40, t + .14);
        const g = G();
        perc(g, t, v * .9, .004, .3);
        const f = Fl('lowpass', 220);
        o.connect(f);
        f.connect(g);
        out(g, drums);
        o.stop(t + .4);
        return;
      }
      const chip = k === 'chip',
        soft = k === 'soft';
      const o = O(chip ? 'square' : 'sine', chip ? 140 : soft ? 115 : 155, t);
      o.frequency.exponentialRampToValueAtTime(chip ? 42 : 45, t + (chip ? .07 : .11));
      const g = G();
      perc(g, t, v * (soft ? .75 : chip ? .95 : 1), .002, soft ? .3 : chip ? .12 : .42);
      if (chip) {
        const f = Fl('lowpass', 1400);
        o.connect(f);
        f.connect(g);
      } else o.connect(g);
      out(g, drums);
      o.stop(t + .5);
      if (!soft) out(nz(t, .012, 'highpass', 3500, .7, v * (chip ? .15 : .22)), drums);
      if (soft) out(nz(t, .05, 'lowpass', 900, .7, v * .12), drums);
    },
    snare(e, t) {
      const k = e.x || 'main',
        v = e.v;
      if (k === 'brush') {
        out(nz(t, .28, 'bandpass', 3200, .6, v * .5, 2000, .035), drums, .1, .15);
        return;
      }
      if (k === 'chip') {
        const s = A.createBufferSource();
        s.buffer = nb;
        s.playbackRate.value = .25;
        const g = G();
        perc(g, t, v * .7, .001, .12);
        s.connect(g);
        s.start(t, hsh(t) * 1.5, .2);
        out(g, drums);
        out(tn(t, 220, .05, v * .15, 'square', 140), drums);
        return;
      }
      if (k === 'lofi') {
        out(nz(t, .14, 'lowpass', 3200, .7, v * .32), drums, 0, .25);
        out(tn(t, 330, .04, v * .18, 'triangle'), drums);
        return;
      }
      if (k === 'ind') {
        out(nz(t, .2, 'bandpass', 1300, .9, v * .5), drums, 0, .3);
        out(tn(t, 180, .12, v * .3, 'sawtooth', 90), drums);
        out(nz(t, .05, 'highpass', 6000, .7, v * .2), drums);
        return;
      }
      const gated = k === 'gated';
      out(nz(t, gated ? .26 : .17, 'bandpass', 1900, .8, v * .45), drums, 0, gated ? .6 : .2);
      out(tn(t, 195, .09, v * .3, 'triangle', 165), drums);
      out(nz(t, .06, 'highpass', 5500, .7, v * .18), drums);
    },
    clap(e, t) {
      const v = e.v;
      [0, .011, .022].forEach(d => out(nz(t + d, .012, 'bandpass', 1300, 1.2, v * .3), drums));
      out(nz(t + .03, .16, 'bandpass', 1200, 1, v * .3), drums, 0, .3);
    },
    hat(e, t) {
      const k = e.x || 'closed',
        v = e.v;
      if (k === 'chip') {
        const s = A.createBufferSource();
        s.buffer = nb;
        const f = Fl('highpass', 6000);
        const g = G();
        perc(g, t, v * .3, .001, .035);
        s.connect(f);
        f.connect(g);
        s.start(t, hsh(t) * 1.5, .06);
        out(g, drums, .2);
        return;
      }
      out(nz(t, k === 'open' ? .28 : .045, 'highpass', 7200, .6, v * (k === 'open' ? .13 : .16)), drums, hsh(t * 3) * .4 - .2);
    },
    ride(e, t) {
      const v = e.v;
      out(nz(t, .7, 'bandpass', 6500, 1.4, v * .38), drums, .25, .1);
      [3150, 4720].forEach(f => out(tn(t, f, .5, v * .015, 'square'), drums, .25));
    },
    crash(e, t) {
      const v = e.v;
      out(nz(t, 2.2, 'highpass', 3800, .5, v * .22, 0, .003), drums, 0, .3);
      out(nz(t, 1.2, 'bandpass', 5000, .8, v * .1), drums, -.3, .2);
    },
    tom(e, t) {
      out(tn(t, e.m, .32, e.v * .5, 'sine', e.m * .6), drums, (e.m - 170) / 200, .15);
    },
    wood(e, t) {
      out(tn(t, e.m, .06, e.v * .3, 'sine'), drums, e.m > 1000 ? .35 : -.35, .1);
      out(nz(t, .015, 'bandpass', e.m * 2, 2, e.v * .12), drums);
    },
    shaker(e, t) {
      out(nz(t, .05, 'highpass', 6500, .7, e.v * .09, 0, .01), drums, .3);
    },
    tick(e, t) {
      out(tn(t, 5200, .018, e.v * .09, 'square'), drums, .35);
      out(nz(t, .012, 'highpass', 8000, .7, e.v * .08), drums, -.35);
    },
    pad(e, t) {
      const k = e.x || 'warm',
        notes = e.m,
        end = t + e.d,
        v = e.v;
      notes.forEach((m, j) => {
        const pan = (j - (notes.length - 1) / 2) * .35,
          f = mtof(m);
        const g = G();
        if (k === 'warm') {
          [-7, 7].forEach(dt => {
            const o = O('sawtooth', f, t);
            o.detune.value = dt;
            const fl = Fl('lowpass', 1300, .5);
            o.connect(fl);
            fl.connect(g);
            o.stop(end + 1.3);
          });
          const o2 = O('triangle', f / 2, t);
          const g2 = G();
          g2.gain.value = .35;
          o2.connect(g2);
          g2.connect(g);
          o2.stop(end + 1.3);
          adsr(g, t, .036 * v, .7, .5, .85, end, 1.2);
          out(g, synth, pan, .45);
        } else if (k === 'string') {
          [-11, 0, 11].forEach(dt => {
            const o = O('sawtooth', f, t);
            o.detune.value = dt;
            const fl = Fl('lowpass', 2400, .5);
            o.connect(fl);
            fl.connect(g);
            o.stop(end + 1);
          });
          adsr(g, t, .026 * v, .35, .4, .8, end, .8);
          out(g, synth, pan, .45);
        } else if (k === 'glass') {
          const o = O('sine', f, t),
            o2 = O('triangle', f * 2, t),
            g2 = G();
          g2.gain.value = .35;
          o.connect(g);
          o2.connect(g2);
          g2.connect(g);
          o.stop(end + 1);
          o2.stop(end + 1);
          adsr(g, t, .03 * v, .25, .6, .7, end, .8);
          out(g, synth, pan, .5);
        } else if (k === 'organ') {
          [[1, 1], [2, .45], [3, .2]].forEach(([h, a]) => {
            const o = O('sine', f * h, t),
              g2 = G();
            g2.gain.value = a;
            o.connect(g2);
            g2.connect(g);
            o.stop(end + .5);
          });
          adsr(g, t, .05 * v, .05, .3, .8, end, .3);
          out(g, synth, pan, .3);
        } else if (k === 'choir') {
          const mix = G();
          [-9, 9].forEach(dt => {
            const o = O('sawtooth', f, t);
            o.detune.value = dt;
            vib(o, t, 4.8 + j * .3, 9, .3).stop(end + 1.2);
            o.connect(mix);
            o.stop(end + 1.2);
          });
          [[720, 6], [1180, 7], [2500, 8]].forEach(([ff, q], i) => {
            const bp = Fl('bandpass', ff, q),
              g3 = G();
            g3.gain.value = [1, .6, .25][i];
            mix.connect(bp);
            bp.connect(g3);
            g3.connect(g);
          });
          adsr(g, t, .09 * v, .55, .4, .85, end, 1);
          out(g, synth, pan, .6);
        } else if (k === 'dark') {
          [-15, 15].forEach(dt => {
            const o = O('sawtooth', f, t);
            o.detune.value = dt;
            const fl = Fl('lowpass', 500, 2);
            const l = O('sine', .5, t),
              lg = G();
            lg.gain.value = 450;
            l.connect(lg);
            lg.connect(fl.frequency);
            o.connect(fl);
            fl.connect(g);
            o.stop(end + 1);
            l.stop(end + 1);
          });
          adsr(g, t, .034 * v, .4, .4, .85, end, .8);
          out(g, synth, pan, .4);
        }
      });
    },
    drone(e, t) {
      const end = t + e.d,
        f = mtof(e.m),
        g = G();
      [-6, 6].forEach(dt => {
        const o = O('sawtooth', f, t);
        o.detune.value = dt;
        const fl = Fl('lowpass', 260, 1);
        o.connect(fl);
        fl.connect(g);
        o.stop(end + 2);
      });
      adsr(g, t, .08 * e.v, 2, 1, .9, end, 2);
      out(g, synth, 0, .2);
    },
    bass(e, t) {
      const k = e.x || 'sub',
        f = mtof(e.m),
        end = t + e.d,
        v = e.v,
        g = G();
      if (k === 'sub') {
        const o = O('sine', f, t);
        o.connect(g);
        o.stop(end + .3);
        adsr(g, t, .32 * v, .02, .1, .9, end, .15);
        out(g, synth);
        return;
      }
      if (k === 'saw' || k === 'seq') {
        const o = O(k === 'seq' ? 'square' : 'sawtooth', f, t),
          fl = Fl('lowpass', 1600, k === 'seq' ? 4 : 2);
        fl.frequency.exponentialRampToValueAtTime(k === 'seq' ? 380 : 320, t + .16);
        const s = O('sine', f, t),
          sg = G();
        sg.gain.value = .9;
        s.connect(sg);
        sg.connect(g);
        o.connect(fl);
        fl.connect(g);
        o.stop(end + .2);
        s.stop(end + .2);
        adsr(g, t, (k === 'seq' ? .13 : .16) * v, .004, .12, .7, Math.max(t + .05, end - .03), .06);
        out(g, synth);
        return;
      }
      if (k === 'pluck') {
        const o = O('sawtooth', f, t),
          fl = Fl('lowpass', 2600, 3);
        fl.frequency.exponentialRampToValueAtTime(380, t + .14);
        o.connect(fl);
        fl.connect(g);
        o.stop(end + .2);
        const s = O('sine', f, t);
        s.connect(g);
        s.stop(end + .2);
        adsr(g, t, .17 * v, .003, .1, .5, end, .05);
        out(g, synth);
        return;
      }
      if (k === 'upright') {
        const o = O('triangle', f * 1.012, t);
        o.frequency.exponentialRampToValueAtTime(f, t + .05);
        const s = O('sine', f, t);
        const fl = Fl('lowpass', 900);
        o.connect(fl);
        s.connect(fl);
        fl.connect(g);
        o.stop(end + .3);
        s.stop(end + .3);
        perc(g, t, .24 * v, .006, Math.min(.9, e.d + .1));
        out(g, synth, 0, .08);
        out(nz(t, .02, 'bandpass', 1200, 1.5, v * .05), synth);
        return;
      }
      if (k === 'chip') {
        const o = O('triangle', f, t);
        o.connect(g);
        o.stop(end + .1);
        adsr(g, t, .32 * v, .002, .05, .9, end, .02);
        out(g, synth);
        return;
      }
      if (k === '808') {
        const o = O('sine', f * 2, t);
        o.frequency.exponentialRampToValueAtTime(f, t + .08);
        const ws = A.createWaveShaper();
        ws.curve = clipCurve();
        const pre = G();
        pre.gain.value = 3;
        o.connect(pre);
        pre.connect(ws);
        ws.connect(g);
        o.stop(end + .3);
        adsr(g, t, .2 * v, .003, .3, .7, end, .2);
        const fl = Fl('lowpass', 900);
        g.connect(fl);
        out(fl, synth);
      }
    },
    lead(e, t, k) {
      const f = mtof(e.m),
        end = t + e.d,
        v = e.v,
        g = G();
      if (k === 'saw') {
        [-12, 12].forEach(dt => {
          const o = O('sawtooth', f, t);
          o.detune.value = dt;
          vib(o, t, 5.5, 14, .25).stop(end + .4);
          const fl = Fl('lowpass', 3600, .8);
          o.connect(fl);
          fl.connect(g);
          o.stop(end + .4);
        });
        const sq = O('square', f / 2, t),
          sg = G();
        sg.gain.value = .25;
        sq.connect(sg);
        sg.connect(g);
        sq.stop(end + .4);
        adsr(g, t, .09 * v, .015, .2, .8, Math.max(t + .05, end - .02), .25);
        out(g, synth, 0, .3, .28);
        return;
      }
      if (k === 'flute') {
        const o = O('sine', f, t),
          o2 = O('triangle', f, t),
          g2 = G();
        g2.gain.value = .3;
        vib(o, t, 5, 12, .3).stop(end + .5);
        o.connect(g);
        o2.connect(g2);
        g2.connect(g);
        o.stop(end + .5);
        o2.stop(end + .5);
        out(nz(t, Math.min(e.d, .5), 'bandpass', f * 2, 3, v * .02, 0, .06), synth, 0, .4);
        adsr(g, t, .085 * v, .07, .2, .85, end, .3);
        out(g, synth, -.1, .55, .3);
        return;
      }
      if (k === 'chip') {
        const o = O('pulse25', f, t);
        vib(o, t, 6, 18, .18).stop(end + .1);
        o.connect(g);
        o.stop(end + .1);
        adsr(g, t, .5 * v, .003, .08, .8, Math.max(t + .03, end - .02), .03);
        out(g, synth, .1, .05);
        return;
      }
      if (k === 'trumpet') {
        const o = O('sawtooth', f, t);
        o.detune.setValueAtTime(-40, t);
        o.detune.linearRampToValueAtTime(0, t + .07);
        vib(o, t, 5, 16, .25).stop(end + .3);
        const bp = Fl('bandpass', 1500, 1.6),
          lp = Fl('lowpass', 2800, .7);
        o.connect(bp);
        bp.connect(lp);
        lp.connect(g);
        o.stop(end + .3);
        adsr(g, t, .32 * v, .05, .2, .75, Math.max(t + .06, end - .04), .14);
        out(g, synth, .15, .5);
        return;
      }
      if (k === 'bell') {
        [[1, 1, 1.6], [2.76, .35, .5], [5.4, .18, .25]].forEach(([h, a, d]) => out(tn(t, f * h, d * Math.max(1, e.d), .12 * v * a), synth, .2, .5, .25));
        return;
      }
      if (k === 'whistle') {
        const o = O('sine', f * 2, t);
        vib(o, t, 6, 20, .15).stop(end + .3);
        o.connect(g);
        o.stop(end + .3);
        adsr(g, t, .09 * v, .04, .1, .8, end, .12);
        out(g, synth, .2, .45);
        out(nz(t, Math.min(e.d, .3), 'bandpass', f * 2, 6, v * .012, 0, .03), synth);
        return;
      }
      if (k === 'square') {
        const o = O('pulse40', f, t),
          fl = Fl('lowpass', 3000, 1);
        fl.frequency.exponentialRampToValueAtTime(900, t + .3);
        o.connect(fl);
        fl.connect(g);
        o.stop(end + .2);
        adsr(g, t, .2 * v, .004, .15, .55, end, .1);
        out(g, synth, .15, .25, .3);
        return;
      }
      if (k === 'box') {
        [[1, 1, 1.4], [3, .25, .45], [4.2, .12, .25]].forEach(([h, a, d]) => out(tn(t, f * h, d, .11 * v * a, 'sine'), synth, .1, .6, .2));
      }
    },
    pluck(e, t, k) {
      const f = mtof(e.m),
        v = e.v;
      if (k === 'tri') {
        out(tn(t, f, .45, .12 * v, 'triangle'), synth, hsh(t) * .8 - .4, .45, .35);
        return;
      }
      if (k === 'arp') {
        const o = O('sawtooth', f, t),
          fl = Fl('lowpass', 3600, 2),
          g = G();
        fl.frequency.exponentialRampToValueAtTime(1100, t + .12);
        o.connect(fl);
        fl.connect(g);
        o.stop(t + .3);
        adsr(g, t, .2 * v, .002, .08, .45, t + .1, .12);
        out(g, synth, hsh(t * 7) * .6 - .3, .2, .35);
        return;
      }
      if (k === 'kalimba') {
        out(tn(t, f, .7, .1 * v), synth, hsh(t) * .6 - .3, .35, .15);
        out(tn(t, f * 5.95, .06, .03 * v), synth, 0, .2);
        out(tn(t, f * 2, .2, .025 * v), synth);
        return;
      }
      if (k === 'chiparp') {
        const o = O('pulse50', f, t),
          g = G();
        o.connect(g);
        o.stop(t + .16);
        adsr(g, t, .22 * v, .002, .04, .6, t + .09, .03);
        out(g, synth, -.15);
        return;
      }
      if (k === 'marimba') {
        out(tn(t, f, .35, .1 * v), synth, 0, .3);
        out(tn(t, f * 4, .05, .03 * v), synth);
      }
    },
    stab(e, t) {
      for (const m of e.m) {
        const o = O('sawtooth', mtof(m + 12), t),
          fl = Fl('lowpass', 2600, 1.5),
          g = G();
        fl.frequency.exponentialRampToValueAtTime(800, t + .12);
        o.connect(fl);
        fl.connect(g);
        o.stop(t + .25);
        adsr(g, t, .09 * e.v, .003, .06, .5, t + .08, .1);
        out(g, synth, (m % 3 - 1) * .3, .25);
      }
    },
    rhodes(e, t) {
      for (const m of e.m) {
        const f = mtof(m),
          c = O('sine', f, t),
          md = O('sine', f, t),
          mg = G();
        mg.gain.setValueAtTime(f * 2.2, t);
        mg.gain.exponentialRampToValueAtTime(f * .25, t + .6);
        md.connect(mg);
        mg.connect(c.frequency);
        const g = G();
        perc(g, t, .055 * e.v, .004, e.d + .4);
        c.connect(g);
        c.stop(t + e.d + .5);
        md.stop(t + e.d + .5);
        out(g, synth, (m % 4 - 1.5) * .2, .35);
      }
    },
    riser(e, t) {
      const end = t + e.d;
      out(nz(t, e.d, 'bandpass', 250, 2.5, e.v * .12, 7000, e.d * .9), synth, 0, .3);
      const o = O('sawtooth', 110, t);
      o.frequency.exponentialRampToValueAtTime(880, end);
      const g = G();
      g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(.025 * e.v, end);
      g.gain.linearRampToValueAtTime(.0001, end + .05);
      const fl = Fl('lowpass', 2000);
      o.connect(fl);
      fl.connect(g);
      o.stop(end + .1);
      out(g, synth, 0, .3);
    },
    rev(e, t) {
      const end = t + e.d,
        s = A.createBufferSource();
      s.buffer = nb;
      const fl = Fl('highpass', 3000),
        g = G();
      g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(.2 * e.v, end - .02);
      g.gain.linearRampToValueAtTime(.0001, end);
      s.connect(fl);
      fl.connect(g);
      s.start(t, hsh(t) * .2, e.d + .05);
      out(g, drums, 0, .4);
    },
    impact(e, t) {
      out(tn(t, 70, 1.6, .9 * e.v, 'sine', 28), drums, 0, .3);
      out(nz(t, 1.4, 'lowpass', 1200, .7, .45 * e.v, 120), drums, 0, .6);
      out(nz(t, .08, 'highpass', 2000, .7, .3 * e.v), drums);
    },
    siren(e, t) {
      const end = t + e.d,
        o = O('sawtooth', 600, t),
        l = O('sine', 1.2, t),
        lg = G();
      lg.gain.value = 180;
      l.connect(lg);
      lg.connect(o.frequency);
      const bp = Fl('bandpass', 1200, 2),
        g = G();
      o.connect(bp);
      bp.connect(g);
      adsr(g, t, .05 * e.v, .2, .2, .9, end, .3);
      o.stop(end + .4);
      l.stop(end + .4);
      out(g, synth, 0, .4, .2);
    },
    // 雨：循环噪声做雨幕，稀疏的高频点做雨滴（现实戏的环境声）
    rain(e, t) {
      const end = t + e.d,
        sv = A.createBufferSource();
      sv.buffer = nb;
      sv.loop = true;
      const lp = Fl('lowpass', 2800, .4),
        hp = Fl('highpass', 380, .5),
        g = G();
      adsr(g, t, .06 * e.v, 1.2, .4, 1, end, 1.5);
      sv.connect(lp);
      lp.connect(hp);
      hp.connect(g);
      sv.start(t, hsh(t) * 1.5);

    for (let layer = 0; layer < 3; layer++) {
      const base = h * (.5 + layer * .12),
        dark = [`#0b1022`, `#080b18`, `#05070f`][layer];
      for (let bx = -20; bx < w;) {
        const bw = 40 + r() * 110,
          bh = (90 + r() * 260) * (1 - layer * .2);
        x.fillStyle = dawn > 0 ? `rgba(${lerp(8, 70, dawn * (1 - layer * .3))},${lerp(10, 60, dawn)},${lerp(22, 80, dawn)},1)` : dark;
        x.fillRect(bx, base - bh, bw, h);
        for (let wy = base - bh + 10; wy < h - 6; wy += 14) for (let wx = bx + 6; wx < bx + bw - 6; wx += 12) {
          if (r() < .32 * (1 - dawn * .8)) {
            x.fillStyle = r() < .7 ? `rgba(255,${190 + r() * 50},${120 + r() * 60},${.5 + r() * .5})` : `rgba(160,200,255,${.4 + r() * .4})`;
            x.fillRect(wx, wy, 5, 7);
          }
        }
        bx += bw + r() * 8;
      }
    }
    if (dawn <= 0) for (let i = 0; i < 60; i++) {
      const bx = r() * w,
        by = h * (.55 + r() * .4),
        rr = 6 + r() * 26,
        gg = x.createRadialGradient(bx, by, 0, bx, by, rr);
      const c = r() < .5 ? '255,170,90' : r() < .5 ? '255,80,120' : '120,180,255';
      gg.addColorStop(0, `rgba(${c},.55)`);
      gg.addColorStop(1, `rgba(${c},0)`);
      x.fillStyle = gg;
      x.fillRect(bx - rr, by - rr, rr * 2, rr * 2);
    }
  }
  function drawWood(x, w, h) {
    x.fillStyle = '#3a2a20';
    x.fillRect(0, 0, w, h);
    for (let i = 0; i < 12; i++) {
      const y = i * h / 12;
      x.fillStyle = i % 2 ? '#43301f' : '#3b2b1d';
      x.fillRect(0, y, w, h / 12 - 2);
      for (let k = 0; k < 30; k++) {
        x.strokeStyle = `rgba(20,12,6,${.08 + Math.random() * .1})`;
        x.beginPath();
        const yy = y + Math.random() * h / 12;
        x.moveTo(0, yy);
        x.bezierCurveTo(w * .3, yy + 3, w * .6, yy - 3, w, yy + 1);
        x.stroke();
      }
    }
  }
  function drawClock(x, s, hh, mm) {
    x.clearRect(0, 0, s, s);
    const c = s / 2;
    x.fillStyle = '#efe9dd';
    x.beginPath();
    x.arc(c, c, c * .96, 0, 6.283);
    x.fill();
    x.lineWidth = s * .04;
    x.strokeStyle = '#2a2a2e';
    x.stroke();
    for (let i = 0; i < 12; i++) {
      const a = i / 12 * 6.283;
      x.lineWidth = i % 3 ? s * .012 : s * .028;
      x.beginPath();
      x.moveTo(c + Math.sin(a) * c * .78, c - Math.cos(a) * c * .78);
      x.lineTo(c + Math.sin(a) * c * .88, c - Math.cos(a) * c * .88);
      x.stroke();
    }
    const ha = (hh % 12 + mm / 60) / 12 * 6.283,
      ma = mm / 60 * 6.283;
    x.lineCap = 'round';
    x.strokeStyle = '#1d1d22';
    x.lineWidth = s * .045;
    x.beginPath();
    x.moveTo(c, c);
    x.lineTo(c + Math.sin(ha) * c * .48, c - Math.cos(ha) * c * .48);
    x.stroke();
    x.lineWidth = s * .03;
    x.beginPath();
    x.moveTo(c, c);
    x.lineTo(c + Math.sin(ma) * c * .72, c - Math.cos(ma) * c * .72);
    x.stroke();
    x.fillStyle = '#d97757';
    x.beginPath();
    x.arc(c, c, s * .035, 0, 6.283);
    x.fill();
  }
  function drawNote(x, s, lines, crossed) {
    x.fillStyle = '#ffe27a';
    x.fillRect(0, 0, s, s);

    x.fillRect(0, 0, s, s * .14);
    x.fillStyle = '#3a2f20';
    x.textBaseline = 'middle';
    lines.forEach((l, i) => {
      x.font = `${i ? 600 : 900} ${i ? s * .085 : s * .13}px "Ma Shan Zheng","Noto Sans SC",sans-serif`;
      x.fillText(l, s * .08, s * (.28 + i * .17));
    });
    if (crossed) {
      x.strokeStyle = 'rgba(200,40,40,.85)';
      x.lineWidth = s * .03;
      x.beginPath();
      x.moveTo(s * .06, s * .3);
      x.lineTo(s * .94 * crossed, s * .3 + s * .02);
      x.stroke();
    }
  }

    x.fillText('Clawd', px0 + 44, 60);
    let y = h - 70;
    const vis = chat.filter(m => L.b >= m.at).slice(-6).reverse();
    for (const m of vis) {
      const me = !!m.me,
        s = (me ? m.me : m.you).replace(/[‹›«»]/g, ''),
        n = me ? s.length : Math.min(s.length, Math.floor(clamp01((L.b - m.at - .03) / Math.max(.05, Math.min(.5, s.length * .028))) * s.length + 1e-6));
      if (me && L.b < m.at + .5 + (m.wait || 0)) {
        x.fillStyle = '#2a1d18';
        roundR(x, px0 + 14, y - 26, 60, 30, 10);
        x.fill();
        x.fillStyle = '#d97757';
        for (let i = 0; i < 3; i++) {
          x.globalAlpha = .4 + .6 * (Math.floor(t * 6 + i) % 3 === 0);
          x.beginPath();
          x.arc(px0 + 30 + i * 14, y - 11, 3.5, 0, 6.283);
          x.fill();
        }
        x.globalAlpha = 1;
        y -= 44;
        continue;
      }
      x.font = '500 15px "Noto Sans SC",sans-serif';
      const wrapped = wrapCJK(x, s.slice(0, n), (w - px0) * .78);
      const bh = wrapped.length * 20 + 14,
        bw = Math.min((w - px0) * .82, Math.max(...wrapped.map(l => x.measureText(l).width)) + 22);
      const bx = me ? px0 + 14 : w - 14 - bw;
      x.fillStyle = me ? '#2a1d18' : '#e9e9ec';
      roundR(x, bx, y - bh, bw, bh, 10);
      x.fill();
      x.fillStyle = me ? '#f6efe8' : '#16171c';
      wrapped.forEach((l, i) => x.fillText(l, bx + 11, y - bh + 20 + i * 20));
      y -= bh + 12;
      if (y < 80) break;
    }
    // 输入框
    x.fillStyle = '#1c1d24';

    x.fillText(cfg.inputHint || '给 Clawd 发消息', px0 + 24, h - 27);
    if (cfg.screenOverlay) cfg.screenOverlay(x, w, h, L, S);
  }
  function roundR(x, a, b, w, h, r) {
    x.beginPath();
    x.roundRect(a, b, w, h, r);

  function wrapCJK(x, s, maxW) {
    const out = [];
    let l = '';
    for (const ch of s) {
      if (x.measureText(l + ch).width > maxW && l) {
        out.push(l);
        l = '';
      }
      l += ch;
    }
    out.push(l);
    return out;
  }

    const headG = new T.Group();

  // 每帧：按这一场戏的设定摆好房间
  function pose(R, T, L, cfg, chat, cam, S, shots) {
    const b = L.b,
      t = L.t;
    const mood = cfg.room ? cfg.room(L, S) : {};
    const dawn = mood.dawn ?? 0,
      rainK = mood.rain ?? 1,
      lampOn = mood.lamp ?? 1,
      screenOn = mood.screen ?? 1;
    // 钟：开始时间 + 每小节走 clockRate 分钟
    const [h0, m0] = cfg.clock || [21, 0],
      mins = h0 * 60 + m0 + b * (cfg.clockRate ?? .25),
      hh = Math.floor(mins / 60) % 24,
      mm = Math.floor(mins % 60);
    const ck = hh + ':' + mm;
    if (ck !== R.lastClock) {
      drawClock(R.clk.x, 256, hh, mm);
      R.clk.t.needsUpdate = true;
      R.lastClock = ck;
    }
    const dq = Math.round(dawn * 20) / 20;
    if (dq !== R.lastDawn) {
      drawCity(R.city.x, 1024, 512, dq);
      R.city.t.needsUpdate = true;
      R.lastDawn = dq;
    }
    const nk = JSON.stringify([cfg.note || ['周一 8:00 交', '图书管理系统', '加登录功能'], mood.noteCross || 0]);
    if (nk !== R.lastNote) {
      drawNote(R.note.x, 256, cfg.note || ['周一 8:00 交', '图书管理系统', '加登录功能'], mood.noteCross || 0);
      R.note.t.needsUpdate = true;
      R.lastNote = nk;
    }
    // 屏幕、手机
    if (screenOn > 0) {
      drawScreen(R.scr.x, 1024, 640, L, cfg, chat, S);
      if (screenOn < 1) {
        R.scr.x.fillStyle = `rgba(0,0,0,${1 - screenOn})`;
        R.scr.x.fillRect(0, 0, 1024, 640);
      }
    } else {
      R.scr.x.fillStyle = '#050506';
      R.scr.x.fillRect(0, 0, 1024, 640);
    }
    R.scr.t.needsUpdate = true;
    const px = R.ph.x;
    px.fillStyle = '#050608';
    px.fillRect(0, 0, 256, 512);
    if (cfg.phone) cfg.phone(px, 256, 512, L, S);
    R.ph.t.needsUpdate = true;
    // 雨
    R.glassU.uT.value = t;
    R.glassU.uRain.value = rainK;
    R.glassU.uDawn.value = dawn;
    R.rain.material.opacity = .35 * rainK;
    for (let i = 0; i < R.rs.length; i++) {
      const [x, y0, z, sp] = R.rs[i],
        y = ((y0 - t * 520 * sp) % 360 + 360) % 360 - 20;
      R.rp.set([x, y, z, x - 3, y + 22 * sp, z], i * 6);
    }
    R.rain.geometry.attributes.position.needsUpdate = true;
    // 热气（越往后越淡）
    const hot = mood.steam ?? 1;
    R.steam.forEach((m, i) => {
      const k = (t * .35 + i / 6) % 1;
      m.position.set(Math.sin(t * .8 + i * 2) * 1.6 * k, 9 + k * 16, Math.cos(t * .6 + i) * 1.2 * k);
      m.scale.setScalar(.6 + k * 1.4);
      m.material.opacity = .09 * hot * Math.sin(Math.PI * k);
    });
    // 灯
    R.lamp.intensity = 2.2 * lampOn;
    R.bulb.visible = lampOn > .1;
    R.glow.intensity = 1.1 * screenOn * (mood.glow ?? 1);
    R.moon.intensity = .5 * (1 - dawn) * (mood.moon ?? 1);
    R.sun.intensity = 2.6 * dawn;
    R.amb.intensity = .55 + dawn * .6;
    R.fill.intensity = .25 + dawn * .3;
    if (mood.flicker) {
      const f = mood.flicker;
      R.lamp.intensity *= 1 - f * (Math.sin(t * 40) > .2 ? .8 : 0);
    }
    // 你：打字、往后靠、转头
    const p = cfg.figure ? cfg.figure(L, S) : {};
    const typing = p.type ?? 0,
      lean = p.lean ?? 0,
      yaw = p.yaw ?? 0,
      nod = p.nod ?? 0;
    R.you.visible = p.hide ? false : true;
    R.you.rotation.x = -.12 + lean * .28;
    R.you.position.z = -92 + lean * 6;
    R.headG.rotation.set(-.1 + lean * .15 + nod * Math.sin(t * 7) * .06, yaw, 0);
    R.arms.forEach(({
      g,
      fore
    }, i) => {
      const sd = i ? 1 : -1,
        tp = typing * Math.max(0, Math.sin(t * 14 + i * 2.1)) * .12;
      if (p.armsUp) {
        g.rotation.set(2.7, 0, sd * -.35);
        fore.rotation.set(.9, 0, 0);
        return;
      }
      g.rotation.set(.95 - lean * .45 - tp, 0, sd * -.1);
      fore.rotation.set(.62 + lean * .25 + tp * 1.5, 0, sd * .22);
    });
    R.lid.rotation.x = -.22 + (mood.lidClose ?? 0) * 1.72;
    // 相机：在镜头之间按设定移动；加一点手持晃动
    let k0 = shots[0],
      k1 = null;
    for (let i = 0; i < shots.length; i++) if (b >= shots[i][0]) {
      k0 = shots[i];
      k1 = shots[i - 1] || null;
    }
    const [at, name, dur = 1.5, ease = 'io'] = k0,
      A = shotOf(name),
      Bp = k1 ? shotOf(k1[1]) : A;
    // 屏幕特写是插入镜头：切进去、切出来，不做推拉，免得看着像要进屏幕
    const cut = k1 && k1[1] === 'screen' && name !== 'into';
    const kk = dur > 0 && !cut ? clamp01((b - at) / dur) : 1,
      e = ease === 'lin' ? kk : ease === 'in' ? kk * kk * kk : io(kk);
    const P0 = Bp,
      P1 = A;
    const pos = [0, 1, 2].map(j => lerp(P0[0][j], P1[0][j], e)),
      tgt = [0, 1, 2].map(j => lerp(P0[1][j], P1[1][j], e)),
      fov = lerp(P0[2], P1[2], e);
    // 从过肩推向屏幕时走一条从头顶越过去的弧线，不从人物身上穿过去
    if ((name === 'screen' || name === 'into') && k1 && !['screen', 'into'].includes(k1[1])) pos[1] += 26 * Math.sin(Math.PI * e);
    const sway = cfg.steady ? 0 : 1,
      sw = (a, f) => Math.sin(t * f + a) * sway;
    cam.position.set(pos[0] + sw(1, .37) * .9, pos[1] + sw(2, .29) * .6, pos[2] + sw(3, .23) * .5);
    cam.lookAt(tgt[0] + sw(4, .31) * .3, tgt[1] + sw(5, .27) * .25, tgt[2]);
    cam.fov = fov;
    cam.near = 1;
    cam.far = 3000;
    // 镜头贴近或穿过人物（过肩推到屏幕）时把人物拿掉，避免穿模和挡住画面
    const c = cam.position,
      fz = R.you.position.z;
    const dHead = Math.hypot(c.x - 40, c.y - 112, c.z - fz),
      dBody = Math.hypot(c.x - 40, c.z - fz);
    if (dHead < 48 || c.y > 40 && c.y < 110 && dBody < 28) R.you.visible = false;
  }

  // ---------- 一场现实戏 ----------
  // cfg: { id 场景名 scene, steps（台词步骤表）, shots [[小节, 镜头, 移动小节数, 缓动]], clock [时, 分], clockRate, room(L) → {rain, lamp, dawn, steam, screen, noteCross, flicker, lidClose},
  //        figure(L) → {type, lean, yaw, nod, armsUp, hide}, code, codeScroll, codeOverlay, screenOverlay, phone(ctx,w,h,L), stamp ['周五', '21:03'],
  //        mood(L) → [曝光, 冷暖, 暗角, 光晕], draw(cx, tx, L) 额外画的东西, music, sfx, enter, lb }
  window.MV_REAL = (K, cfg) => {
    const {
      F,
      C,
      E,
      prog,
      lerp: lp,
      rgba,
      fnt,
      rr,
      txt,
      alpha,
      lyric,
      clawd,
      seq,
      narrate,
      scene,
      wrapText,
      LOOK,
      TR
    } = K;
    const S = seq(cfg.steps, {
      tail: cfg.tail ?? .5
    });
    const shots = typeof cfg.shots === 'function' ? cfg.shots(S) : cfg.shots || [[0, 'desk']];
    const chat = S.items.filter(i => i.me || i.you);
    const hideAt = cfg.chatHide ? cfg.chatHide(S) : 1e9;
    chat.forEach(m => {
      m.hide = Math.min(m.out + 6, hideAt);
    });
    // 对话的提示音：你打字的键声，Clawd 的消息到达
    const sfx = [...(typeof cfg.sfx === 'function' ? cfg.sfx(S) : cfg.sfx || [])];
    for (const m of chat) {
      if (m.you) {
        const n = m.you.replace(/[‹›«»]/g, '').length,
          d = Math.min(.5, n * .028);
        for (let i = 0; i < n; i += 2) sfx.push([m.at + .03 + d * i / n, 'key', .7]);
        if (m.enter !== false) sfx.push([m.at + d + .1, 'enter']);
      } else sfx.push([m.at + .5 + (m.wait || 0), 'pop']);
    }
    const m = scene({
      scene: cfg.scene,
      desc: cfg.desc,
      look: LOOK.FILM,
      chat: true,
      noBanner: cfg.noBanner,
      noInv: cfg.noInv ?? true,
      enter: cfg.enter || {
        kind: TR.FLASH,
        a: .25,
        b: .25,
        flash: .4
      },
      hud: {
        ink: '#e8e9ee'
      },
      par: L => cfg.mood ? cfg.mood(L, S) : [.62, .45, .8, .7],
      lb: cfg.lb ? L => cfg.lb(L, S) : L => .45,
      pulse: () => 0,
      sfx,
      music: cfg.music,
      bars: cfg.bars,
      three(T, U) {
        const R = build(T);
        return {
          scene: R.scene,
          update(L, cam) {
            U.renderer.toneMapping = T.ACESFilmicToneMapping;
            U.renderer.toneMappingExposure = cfg.exposure ?? 1.15;
            pose(R, T, L, cfg, chat, cam, S, shots);
            return true;
          }
        };
      },
      draw(cx, tx, L) {
        const b = L.b;
        K.three(cx, L);
        if (cfg.under) cfg.under(cx, tx, L, S);
        // 时间戳（像电影里的地点字幕）
        if (cfg.stamp) {
          const k = prog(b, .3, .9) * (1 - prog(b, 4, 4.6));
          if (k > 0) alpha(tx, k, () => {
            txt(tx, cfg.stamp[0], 120, 880, fnt(500, 26, F.sans), rgba('#ffffff', .7));
            txt(tx, cfg.stamp[1], 116, 930, fnt(300, 64, F.mono), '#f4efe6');
          });
        }
        chatOverlay(tx, L, chat, cfg.chatSide || 'right', K);
        narrate(tx, L, S, cfg.style || {
          sub: {
            y: 990,
            size: 40
          }
        });
        if (cfg.draw) cfg.draw(cx, tx, L, S);
      }
    }, S);
    return m;
  };

  // 对话气泡（大号，叠在画面一侧，方便读）：最新的在下面，最多留 4 条
  function chatOverlay(ctx, L, chat, side, K) {
    const {
        F,
        C,
        prog,
        fnt,
        rr,
        txt,
        alpha,
        wrapText,
        clawd,
        rgba
      } = K,
      b = L.b;
    const shown = chat.filter(m => b >= m.at - .02 && b < m.hide);
    if (!shown.length) return;
    const last = shown.slice(-4),
      X0 = side === 'right' ? 1060 : 90,
      W0 = 760;
    let y = 880;
    const items = [];
    for (let i = last.length - 1; i >= 0; i--) {
      const m = last[i],
        me = !!m.me,
        raw = me ? m.me : m.you,
        n0 = raw.replace(/[‹›«»]/g, '').length;
      const typing = me && b < m.at + .5 + (m.wait || 0);
      let s = raw;
      if (!me) {
        const d = Math.min(.5, n0 * .028),
          n = Math.floor(Math.min(1, Math.max(0, (b - m.at - .03) / Math.max(.05, d))) * n0 + 1e-6);
        s = cut(raw, n);
      }
      ctx.font = fnt(500, 36, F.sans);
      const lines = typing ? ['···'] : wrapText(ctx, s.replace(/[‹›«»]/g, ''), W0 - 150).split('\n');
      const bw = Math.min(W0 - 90, Math.max(...lines.map(l => ctx.measureText(l).width)) + 48),
        bh = lines.length * 50 + 30;
      const age = last.length - 1 - i,
        fade = (age >= 3 ? .35 : age === 2 ? .6 : 1) * (1 - prog(b, m.hide - .3, m.hide));
      items.push({
        me,
        lines,
        bw,
        bh,
        y: y - bh,
        fade,
        k: prog(b, m.at, m.at + .15),
        typing
      });
      y -= bh + 22;
    }
    for (const it of items) {
      alpha(ctx, it.fade * it.k, () => {
        const yy = it.y + (1 - it.k) * 18;
        if (it.me) {
          const x = X0 + 76;
          clawd(ctx, {
            x: X0 + 34,
            y: yy + 52,
