<script>window.OM_SCENES = '[{"name":"片头","dur":5,"desc":"CRT 开机，镜头在 3D 网格地面上缓缓推进，光标闪两下，Clawd 由像素块拼出，片名由像素块逐字飞入，最后炸散"},{"name":"自我介绍","dur":5,"desc":"镜头穿过炸散的片名，Clawd 挥手，名牌弹出，点阵章号 01 逐点亮起"},{"name":"帖子","dur":27,"desc":"像素溶解进入，3D 镜头环绕 Karpathy 帖子，原句打字高亮，Clawd 点头，停留约6秒"},{"name":"年度词","dur":7.5,"desc":"词典封面翻开，盖章时故障闪烁、冲击涟漪、镜头震动"},{"name":"界线","dur":11.5,"desc":"流体扭曲转场，Clawd 敲键盘写出界线代码，三个条件打勾，返回值辉光"},{"name":"项目轴","dur":12,"desc":"镜头侧转进入 3D 空间，地面网格出现，Clawd 推滑块往右，越往右越暖、故障越强"},{"name":"贯穿任务","dur":11,"desc":"Clawd 把滑块拉回作业，任务卡片由像素拼出，Clawd 跳起钉卡片，涟漪，最后 CRT 关机"},{"name":"02 章节卡 · 上下文窗口","dur":26.5,"desc":"像素溶解进入，Clawd 跳到左侧，点阵章号 02 逐点亮起，章名打字出现。流体扭曲转场，透明容器画出，Clawd 跳进去；窗外昨天的对话被抹掉，Clawd 打问号；容量上限线出现，四块内容依次落入"},{"name":"02 知识截止 · Agent 循环","dur":29,"desc":"右侧时间线和训练截止旗子，截止之后一片雾；Clawd 敲出老写法和不存在的方法，红色波浪线。镜头侧转，地面网格出现，椭圆跑道画出；Clawd 跳上跑道，四个节点随旁白依次点亮，每跑一圈往容器扔一块"},{"name":"02 塞满","dur":15.5,"desc":"Clawd 越跑越快，容器快满，旧块闪烁乱码，Clawd 冒汗；跑道换成 18 条下滑曲线，context rot 打字出现"},{"name":"02 压缩 · 三个控制点","dur":17,"desc":"镜头推近容器，再落两块撞到上限，红线闪烁；旧块压扁成一条模糊摘要，碎片飞走，鼓点停一下。像素溶解，三张控制点卡片由像素拼出，Clawd 逐个跳到下方指认；卡片之间箭头连上，作为第 3–6 章目录"},{"name":"03 章节卡 · 一句话 · 随手挑","dur":28,"desc":"像素溶解进入，点阵章号 03 逐点亮起，章名打字出现。输入框里打出「帮我写个登录功能」并发送，缩成树根；四个没说清的问题依次长出分叉，每个标问号。Clawd 闭眼随手一指，橙色路径一路走到结果，结果不是你想要的，Clawd 捂脸；garbage in / garbage out 打字出现并故障闪烁"},{"name":"03 五部分 · 为什么","dur":31,"desc":"流体扭曲转场，五个彩色标签依次弹出，随旁白逐条打出说明，当前那条高亮。第六条虚线标签「+ 为什么」加入，弹出 Anthropic 官方指南徽标，Clawd 点头"},{"name":"03 清楚版 · 报错","dur":23,"desc":"像素溶解，清楚版提示词按五部分着色打出；下方决策树缩小，Clawd 拿剪刀沿正确路径跳，把分叉一根根剪掉，只剩一条绿色路径。报错单四个栏目依次出现并填入示例，最后一张截图飞进来"},{"name":"03 拆小 · 老套路","dur":27,"desc":"「登录功能」大块裂成三个小任务，各自装进一个对话窗口；Clawd 打问号，弹出「先让我提问」「先让我出个方案」。流体扭曲转场，三张便签贴到 Clawd 身上，Clawd 抖一抖全部抖掉；对话框里的话变成大喊，Clawd 用力过猛跳起，最后恢复正常语气"},{"name":"04 章节卡 · 情况","dur":12,"desc":"像素溶解进入，点阵章号 04 逐点亮起，章名打字出现。左边是写清楚的提示词卡片；Clawd 在终端里敲 gradle build 和 npm test，两次都报错，Clawd 冒汗打问号"},{"name":"04 分层","dur":23,"desc":"第 2 章的容器再次出现，提示词卡片缩成顶上一小块；对话、文件、输出依次填进来，规则文件从底部升起垫在最底层；三个规则文件名飞进底层，旧内容全部清走、只剩规则文件；右侧打开 AGENTS.md 逐行写出"},{"name":"04 研究 · 手写 · 指定文件","dur":31,"desc":"流体扭曲转场，ETH Zurich · ICLR 2026 徽标；「AI 自动生成」柱往下掉，8 个方块里 5 个翻红，标成本 +20% 以上；「开发者手写」柱往上长，Clawd 跳起。自动生成的 8 行 AGENTS.md，从代码里看得出来的 5 行被划掉收起，剩 3 行，标签变成「手写 · 3 行」。整个仓库的文件格子被一个个翻找、染色；输入框打出 @UserService.java，其余变暗，只亮一个文件"},{"name":"04 新对话 · 文档","dur":25.5,"desc":"像素溶解，对话 1 里红色失败块一块块砸下来把 Clawd 埋住，只露出眼睛，声音变闷；对话 2 画出，Clawd 拿着「结论」卡片跳出去。流体扭曲转场，雾里的新版本库卡片；官方文档飞进来，相关段落打进雾里，雾散开；切到 MCP 接口图，Clawd 接上 MCP，再连到文档、工具、数据，数据点来回流动"},{"name":"05 章节卡 · 额度 · 重发 · 赛跑","dur":28.5,"desc":"像素溶解进入，点阵章号 05 逐点亮起，章名打字出现。「登录功能」进度条停在一半；本月额度条从绿变红往下掉，金币往外飞，Clawd 盯着冒汗，最后打问号。左边对话一轮轮变长；Clawd 每轮把全部内容打包扛去给模型，包裹越来越大，右下每轮费用柱越来越高。流体扭曲转场，两条跑道：模型 A 单价低绕 9 圈，模型 B 单价高 2 圈完成；总价条逐圈增长，A 最后反超 B"},{"name":"05 算账 · 三档","dur":28.5,"desc":"左边单价标签，右边小票打出完成一个任务的各项花费和总价，单价标签变暗；随后英文和中文句子被切成 token 块。像素溶解，旗舰、主力、轻量三张卡片由像素拼出；Clawd 依次跳到卡片下，能力、速度、价格点亮，适合的任务逐条弹出"},{"name":"05 思考强度 · 预算 · 排行榜","dur":27.7,"desc":"思考强度滑块；「难题」时推到高，Clawd 头顶的思考泡泡变长；「机械性的修改」时拉到低，弹出省时间、省钱。左边订阅制用量柱撞到上限停住；右边按量付费柱越过预算提醒线，铃铛响。流体扭曲转场，排行榜换个测试工具名次就变；公开题目飞进训练数据；之后你的真实任务分给三个模型，各自返回测试结果"},{"name":"05 国内 · 换模型 · 免费版","dur":26.2,"desc":"通义千问、智谱 GLM、Kimi、DeepSeek 四张卡片依次弹出，每张标上编程套餐。对话里卡住，模型从 A 换成 B 再问一遍；青色像素小人跳进来，和 Clawd 击掌。像素溶解，免费版设置里「用我的数据改进模型」开着，代码流向训练；Clawd 指认后关掉；之后两行：课程练习一般没关系，实习和公司代码按公司规定来"},{"name":"06 章节卡 · 怪事 · 外层 · 部件","dur":35.5,"desc":"像素溶解进入，点阵章号 06 逐点亮起，章名打字出现。两个工具窗口装着同一个模型；左边进度条走完打勾，右边走到一半报错、故障闪烁，Clawd 冒汗打问号。Clawd 跳进中间的「模型」圆圈，外面画出一圈 harness，圈内铺满。外圈拉成椭圆，系统提示词、工具、权限、上下文管理、规则文件、hooks、反馈七个部件从四周飞入；随后 hooks 和上下文管理依次高亮并补充说明"},{"name":"06 发动机 · 成绩 · 其他模型","dur":30,"desc":"像素溶解，Clawd 坐进发动机，车身在外面画出；随后分成两条车道两辆车，Clawd 跳进第一辆。Princeton HAL 徽标，Claude Opus 4.5 · CORE-Bench；通用框架那辆开到 42%，Clawd 换到 Claude Code 那辆开到 78%，再推进到 95%。对比柱：Opus 差距大，其他模型差距小，有一个反过来；之后「模型」和「harness」两块并到一起"},{"name":"06 梯子 · RedAccess","dur":33,"desc":"流体扭曲转场，六级梯子逐级亮起附例，Clawd 往上爬；右侧「亲自看的代码量」下降、「需要的检查和隔离」上升；项目轴滑块推到上线，梯子顶端变红。像素溶解，扫描线扫过约 500 个格子代表 38 万个应用，7 个格子变红代表约 5000 个；随后应用设置里「公开」是默认，「私有」没选"},{"name":"06 七项 · 建议 · 打架","dur":29,"desc":"选工具七项清单逐条打勾，静止约 8 秒，鼓点停、音乐变闷。流体扭曲转场，三张卡片：先用 IDEA 里的 Qoder，熟悉 Git 和命令行后试命令行 Agent，应用生成平台只做原型，Clawd 一路跳过去。两个 Clawd 抢同一个 UserService.java，来回拉扯后文件被扯成两半，弹出「冲突」"},{"name":"07 章节卡 · 一口气 · 原因","dur":25.5,"desc":"像素溶解进入，点阵章号 07 逐点亮起，章名打字出现。五个文件依次弹出，Clawd 把五个文件全抱起来左右跑，其中一个冒烟；文件落回原位，烟雾盖住全部，每个文件头上冒问号，Clawd 原地转圈。红色虚线框住五个文件「要翻的范围」，随后文件排成五步，前两步打勾，第三步打叉，虚线框缩到只框住这一步；Clawd 指认「好找」，一条绿色箭头退回上一步"},{"name":"07 流程 · 存档","dur":35,"desc":"像素溶解，六步流程条逐个弹出，Clawd 沿着方块往前跳；「你看计划」是人的蓝色，Clawd 在这里停下等，计划文档里一行被划掉改写，盖上 OK 章后 Clawd 继续往后跳。前三步下方括出「计划模式」，弹出课件提示。流体扭曲转场，Git 时间线画出，Clawd 跳过一个个存档点，每个都闪 SAVE；Clawd 往前走拖出一段红色锯齿，随即读档回到上一个存档点，红色那段收回。时间线上移，会话 1 结束、上下文清空，会话 2 读 git log 接着干，加出第五个提交"},{"name":"07 分支 · 测试","dur":19.5,"desc":"从最后一个提交拉出一条虚线分支 try/jwt，Clawd 跳上去，main 变绿不受影响。像素溶解，左边测试文件三个测试，右边终端跑 gradle test 三次：2 失败、1 失败、全部通过；Clawd 敲键盘。随后第三个测试前闪出 //，Clawd 眼睛左右瞟，弹出「耍小聪明？」和「→ 第 8 章」"},{"name":"07 三次 · 基础","dur":25,"desc":"流体扭曲转场，失败计数器 1→2→3，每次抖动，到 3 变红弹出 STOP；三张选项卡片依次弹出，Clawd 跳到每张下面。像素溶解，「还在学基础语法」标签和一段有越界错误的循环代码，Clawd 往后跳一步举手「先别用我」；放大镜在代码上乱照找不到，最后停在 <= 上标红「越界」。课程说明卡片弹出，盖上「听老师的」"},{"name":"08 章节卡 · 全部通过 · diff","dur":21,"desc":"像素溶解进入，点阵章号 08 逐点亮起，章名打字出现。Clawd 举着「全部通过 ✓」的牌子；镜头拉回，左边 diff 窗口逐行出现，红圈圈出「// @Test」那行，标上「账号锁定」，Clawd 吹口哨看别处，音符飘起。随后标出修改前、修改后，牌子上盖了个「看起来」"},{"name":"08 假完成 · 写死","dur":24.5,"desc":"流体扭曲转场，五张「假完成」卡片依次弹出：注释掉测试、期望值写死、吞掉异常、TODO 假装实现、没跑就说通过。Anthropic 官方指南徽标出现，「期望值写死」那张放大到中间，上方测试 assertEquals(5, failCount()) 和代码里的 return 5 连线「刚好对上」；Clawd 捂脸冒汗"},{"name":"08 编造 · 抢注","dur":25.5,"desc":"像素溶解，方法、参数、配置项、依赖包四行编造的代码，各自画上红色波浪线、标「不存在」。五个模型小机器人头顶冒出同一个包名 fast-bcrypt-utils，弹出「127 个不存在的包名」；包注册表搜索结果为 0，「53 个没人注册」。戴墨镜的灰色陌生小人跳进来抢注，包卡片变成可疑的紫色、标「恶意代码」，故障闪烁；最后打出 slopsquatting"},{"name":"08 三件事 · 查包 · METR","dur":45.5,"desc":"流体扭曲转场，Clawd 举「完成了」牌子，三张蓝色卡片「看 diff」「自己跑一遍」「测边界情况」依次弹出，下面列出空输入、超长输入、非法输入。像素溶解，Maven Central、npm、PyPI 三个标签和一个真实包的卡片，存在、下载量、发布者逐项打勾。流体扭曲转场，METR 徽标和 16 个开发者小人；坐标轴上「实际测量 −19%」往下，「自我感觉 +20%」往上；2026-02 更新的 +18% 是虚线柱，随后打上斜线，标「选择偏差 · 不可靠」"},{"name":"09 章节卡 · 明文密码 · 泄露","dur":40.5,"desc":"像素溶解进入，点阵章号 09 逐点亮起，章名打字出现。Clawd 敲出 DbConfig.java，数据库密码那行变红标「明文密码」；git commit 后这串密码飞进右上角的 GitHub 公开仓库。随后密钥图标像雨一样往下掉，GitGuardian 徽标出现，计数器滚到 2865 万，弹出 +34% 和 AI 服务密钥 +81%。像素溶解，两根横条：Claude Code 参与的提交 3.2%，全体提交基线 1.5%，Clawd 捂脸冒汗"},{"name":"09 不作废 · 代码安全","dur":25.5,"desc":"流体扭曲转场，50 把 2022 年泄露的钥匙排成格子，到 2026-01 时三成多变灰打叉，其余仍亮着，弹出「64% 仍未作废」。像素溶解，Veracode 徽标和「100+ 个模型」，仪表盘指针摆到 56%，旁边一根虚线指针标「前一年差不多」；右边各语言横条依次长出，Java 最短并变橙「约 30%」，Clawd 指认「这门课的语言」"},{"name":"09 PocketOS","dur":34,"desc":"流体扭曲转场，右上角项目轴滑块推到「上线」并闪烁。PocketOS 徽标；蓝色的 Agent 小人跳到文件列表旁，一行行扫过去，在无关文件 old-deploy.txt 里翻出一串发光的 Token，标「权限过大」。右边同一个存储卷里装着生产数据库和备份；Agent 指过去，红色虚线 DROP DATABASE，数据库碎裂，备份跟着碎掉，鼓点停、声音变闷，弹出「−3 个月客户数据」。随后一张蓝色卡片「问题出在人身上」，四条原因逐条打叉出现"},{"name":"09 密钥 · 确认 · 注入 · 别发","dur":51,"desc":"像素溶解，「不写进代码」「不放进前端」「不提交到 Git」逐个打叉；.env 文件放进保险箱，转盘锁上；git add 时 .env 冲向右边，被 .gitignore 墙挡回来。流体扭曲转场，「全部自动批准」开关被关掉；三条危险命令列出，弹出确认框，Clawd 举手等你点「允许」；随后画出沙箱，Clawd 跳进去，和外面的真实数据库隔开。像素溶解，网页、Issue、README、依赖文档四个标签，README 里一行极小的字，Clawd 用放大镜照出隐藏指令；随后来源不明的 MCP 插件，安装按钮被打叉。流体扭曲转场，密码、Token、私钥、个人信息依次飞向 Clawd，被红墙挡回，弹出课件提示"},{"name":"片尾 清单","dur":24,"desc":"像素溶解，Clawd 在中间挥手，随后跳到右下角；清单卡片出现，顶部是缩小的项目轴，滑块停在「作业」；八条清单逐条打勾，每条右侧标着对应章号；Clawd 再挥手说下次见，之后画面静止，鼓点停，最后 CRT 关机"}]';</script>
