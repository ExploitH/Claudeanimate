<script>window.OM_SCENES = '[{"name":"片头","dur":5,"desc":"CRT 开机，镜头在 3D 网格地面上缓缓推进，光标闪两下，Clawd 由像素块拼出，片名由像素块逐字飞入，最后炸散"},{"name":"自我介绍","dur":5,"desc":"镜头穿过炸散的片名，Clawd 挥手，名牌弹出，点阵章号 01 逐点亮起"},{"name":"帖子","dur":27,"desc":"像素溶解进入，3D 镜头环绕 Karpathy 帖子，原句打字高亮，Clawd 点头，停留约6秒"},{"name":"年度词","dur":7.5,"desc":"词典封面翻开，盖章时故障闪烁、冲击涟漪、镜头震动"},{"name":"界线","dur":11.5,"desc":"流体扭曲转场，Clawd 敲键盘写出界线代码，三个条件打勾，返回值辉光"},{"name":"项目轴","dur":12,"desc":"镜头侧转进入 3D 空间，地面网格出现，Clawd 推滑块往右，越往右越暖、故障越强"},{"name":"贯穿任务","dur":11,"desc":"Clawd 把滑块拉回作业，任务卡片由像素拼出，Clawd 跳起钉卡片，涟漪，最后 CRT 关机"},{"name":"02 章节卡 · 上下文窗口","dur":26.5,"desc":"像素溶解进入，Clawd 跳到左侧，点阵章号 02 逐点亮起，章名打字出现。流体扭曲转场，透明容器画出，Clawd 跳进去；窗外昨天的对话被抹掉，Clawd 打问号；容量上限线出现，四块内容依次落入"},{"name":"02 知识截止 · Agent 循环","dur":29,"desc":"右侧时间线和训练截止旗子，截止之后一片雾；Clawd 敲出老写法和不存在的方法，红色波浪线。镜头侧转，地面网格出现，椭圆跑道画出；Clawd 跳上跑道，四个节点随旁白依次点亮，每跑一圈往容器扔一块"},{"name":"02 塞满","dur":15.5,"desc":"Clawd 越跑越快，容器快满，旧块闪烁乱码，Clawd 冒汗；跑道换成 18 条下滑曲线，context rot 打字出现"},{"name":"02 压缩 · 三个控制点","dur":17,"desc":"镜头推近容器，再落两块撞到上限，红线闪烁；旧块压扁成一条模糊摘要，碎片飞走，鼓点停一下。像素溶解，三张控制点卡片由像素拼出，Clawd 逐个跳到下方指认；卡片之间箭头连上，作为第 3–6 章目录"},{"name":"03 章节卡 · 一句话 · 随手挑","dur":28,"desc":"像素溶解进入，点阵章号 03 逐点亮起，章名打字出现。输入框里打出「帮我写个登录功能」并发送，缩成树根；四个没说清的问题依次长出分叉，每个标问号。Clawd 闭眼随手一指，橙色路径一路走到结果，结果不是你想要的，Clawd 捂脸；garbage in / garbage out 打字出现并故障闪烁"},{"name":"03 五部分 · 为什么","dur":31,"desc":"流体扭曲转场，五个彩色标签依次弹出，随旁白逐条打出说明，当前那条高亮。第六条虚线标签「+ 为什么」加入，弹出 Anthropic 官方指南徽标，Clawd 点头"},{"name":"03 清楚版 · 报错","dur":23,"desc":"像素溶解，清楚版提示词按五部分着色打出；下方决策树缩小，Clawd 拿剪刀沿正确路径跳，把分叉一根根剪掉，只剩一条绿色路径。报错单四个栏目依次出现并填入示例，最后一张截图飞进来"},{"name":"03 拆小 · 老套路","dur":27,"desc":"「登录功能」大块裂成三个小任务，各自装进一个对话窗口；Clawd 打问号，弹出「先让我提问」「先让我出个方案」。流体扭曲转场，三张便签贴到 Clawd 身上，Clawd 抖一抖全部抖掉；对话框里的话变成大喊，Clawd 用力过猛跳起，最后恢复正常语气"},{"name":"04 章节卡 · 情况","dur":12,"desc":"像素溶解进入，点阵章号 04 逐点亮起，章名打字出现。左边是写清楚的提示词卡片；Clawd 在终端里敲 gradle build 和 npm test，两次都报错，Clawd 冒汗打问号"},{"name":"04 分层","dur":23,"desc":"第 2 章的容器再次出现，提示词卡片缩成顶上一小块；对话、文件、输出依次填进来，规则文件从底部升起垫在最底层；三个规则文件名飞进底层，旧内容全部清走、只剩规则文件；右侧打开 AGENTS.md 逐行写出"},{"name":"04 研究 · 手写 · 指定文件","dur":31,"desc":"流体扭曲转场，ETH Zurich · ICLR 2026 徽标；「AI 自动生成」柱往下掉，8 个方块里 5 个翻红，标成本 +20% 以上；「开发者手写」柱往上长，Clawd 跳起。自动生成的 8 行 AGENTS.md，从代码里看得出来的 5 行被划掉收起，剩 3 行，标签变成「手写 · 3 行」。整个仓库的文件格子被一个个翻找、染色；输入框打出 @UserService.java，其余变暗，只亮一个文件"},{"name":"04 新对话 · 文档","dur":25.5,"desc":"像素溶解，对话 1 里红色失败块一块块砸下来把 Clawd 埋住，只露出眼睛，声音变闷；对话 2 画出，Clawd 拿着「结论」卡片跳出去。流体扭曲转场，雾里的新版本库卡片；官方文档飞进来，相关段落打进雾里，雾散开；切到 MCP 接口图，Clawd 接上 MCP，再连到文档、工具、数据，数据点来回流动"},{"name":"05 章节卡 · 额度 · 重发 · 赛跑","dur":28.5,"desc":"像素溶解进入，点阵章号 05 逐点亮起，章名打字出现。「登录功能」进度条停在一半；本月额度条从绿变红往下掉，金币往外飞，Clawd 盯着冒汗，最后打问号。左边对话一轮轮变长；Clawd 每轮把全部内容打包扛去给模型，包裹越来越大，右下每轮费用柱越来越高。流体扭曲转场，两条跑道：模型 A 单价低绕 9 圈，模型 B 单价高 2 圈完成；总价条逐圈增长，A 最后反超 B"},{"name":"05 算账 · 三档","dur":28.5,"desc":"左边单价标签，右边小票打出完成一个任务的各项花费和总价，单价标签变暗；随后英文和中文句子被切成 token 块。像素溶解，旗舰、主力、轻量三张卡片由像素拼出；Clawd 依次跳到卡片下，能力、速度、价格点亮，适合的任务逐条弹出"},{"name":"05 思考强度 · 预算 · 排行榜","dur":27.7,"desc":"思考强度滑块；「难题」时推到高，Clawd 头顶的思考泡泡变长；「机械性的修改」时拉到低，弹出省时间、省钱。左边订阅制用量柱撞到上限停住；右边按量付费柱越过预算提醒线，铃铛响。流体扭曲转场，排行榜换个测试工具名次就变；公开题目飞进训练数据；之后你的真实任务分给三个模型，各自返回测试结果"},{"name":"05 国内 · 换模型 · 免费版","dur":26.2,"desc":"通义千问、智谱 GLM、Kimi、DeepSeek 四张卡片依次弹出，每张标上编程套餐。对话里卡住，模型从 A 换成 B 再问一遍；青色像素小人跳进来，和 Clawd 击掌。像素溶解，免费版设置里「用我的数据改进模型」开着，代码流向训练；Clawd 指认后关掉；之后两行：课程练习一般没关系，实习和公司代码按公司规定来"},{"name":"06 章节卡 · 怪事 · 外层 · 部件","dur":35.5,"desc":"像素溶解进入，点阵章号 06 逐点亮起，章名打字出现。两个工具窗口装着同一个模型；左边进度条走完打勾，右边走到一半报错、故障闪烁，Clawd 冒汗打问号。Clawd 跳进中间的「模型」圆圈，外面画出一圈 harness，圈内铺满。外圈拉成椭圆，系统提示词、工具、权限、上下文管理、规则文件、hooks、反馈七个部件从四周飞入；随后 hooks 和上下文管理依次高亮并补充说明"},{"name":"06 发动机 · 成绩 · 其他模型","dur":30,"desc":"像素溶解，Clawd 坐进发动机，车身在外面画出；随后分成两条车道两辆车，Clawd 跳进第一辆。Princeton HAL 徽标，Claude Opus 4.5 · CORE-Bench；通用框架那辆开到 42%，Clawd 换到 Claude Code 那辆开到 78%，再推进到 95%。对比柱：Opus 差距大，其他模型差距小，有一个反过来；之后「模型」和「harness」两块并到一起"},{"name":"06 梯子 · RedAccess","dur":33,"desc":"流体扭曲转场，六级梯子逐级亮起附例，Clawd 往上爬；右侧「亲自看的代码量」下降、「需要的检查和隔离」上升；项目轴滑块推到上线，梯子顶端变红。像素溶解，扫描线扫过约 500 个格子代表 38 万个应用，7 个格子变红代表约 5000 个；随后应用设置里「公开」是默认，「私有」没选"},{"name":"06 七项 · 建议 · 打架","dur":29,"desc":"选工具七项清单逐条打勾，静止约 8 秒，鼓点停、音乐变闷。流体扭曲转场，三张卡片：先用 IDEA 里的 Qoder，熟悉 Git 和命令行后试命令行 Agent，应用生成平台只做原型，Clawd 一路跳过去。两个 Clawd 抢同一个 UserService.java，来回拉扯后文件被扯成两半，弹出「冲突」"}]';</script>
